const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],K={c:'v11c',d:'v11d',o:'v11o',h:'v11h',x:'v11x',tr:'v11tr'};const rd=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}};let cfg=rd(K.c,{lang:'cn',stake:100,hcp:-1,marketW:.3}),data=rd(K.d,{upcoming:[],finished:[]}),odds=rd(K.o,[]),hist=rd(K.h,{}),choices=rd(K.x,[]),TR=rd(K.tr,{}),view=[];Object.assign(TR,{"EC Vitória":"维多利亚","SE Palmeiras":"帕尔梅拉斯","Coritiba FBC":"科里蒂巴","Cruzeiro EC":"克鲁塞罗","SC Corinthians Paulista":"科林蒂安","CA Paranaense":"巴拉纳竞技","Manchester City FC":"曼彻斯特城","Arsenal FC":"阿森纳","Liverpool FC":"利物浦","Real Madrid CF":"皇家马德里","FC Barcelona":"巴塞罗那","Premier League":"英格兰超级联赛","Campeonato Brasileiro Série A":"巴西甲级联赛"});function save(){localStorage.setItem(K.c,JSON.stringify(cfg));localStorage.setItem(K.d,JSON.stringify(data));localStorage.setItem(K.o,JSON.stringify(odds));localStorage.setItem(K.h,JSON.stringify(hist));localStorage.setItem(K.x,JSON.stringify(choices));localStorage.setItem(K.tr,JSON.stringify(TR))}function nm(x){let z=TR[x];return cfg.lang==='en'?x:cfg.lang==='bi'&&z?`${z} (${x})`:z||x}function norm(s){return String(s||'').toLowerCase().replace(/fc|cf|club|sc|ca|ec|se|\s|[-.'’]/g,'')}function fact(n){let z=1;for(let i=2;i<=n;i++)z*=i;return z}function pois(l,k){return Math.exp(-l)*l**k/fact(k)}function tau(h,a,x,y,r=-.08){if(h===0&&a===0)return 1-x*y*r;if(h===0&&a===1)return 1+x*r;if(h===1&&a===0)return 1+y*r;if(h===1&&a===1)return 1-r;return 1}function matrix(x,y){let m=[],s=0;for(let h=0;h<9;h++){m[h]=[];for(let a=0;a<9;a++)s+=(m[h][a]=Math.max(0,pois(x,h)*pois(y,a)*tau(h,a,x,y)))}for(let h=0;h<9;h++)for(let a=0;a<9;a++)m[h][a]/=s;return m}function dynamicElo(){let r={};[...data.finished].sort((a,b)=>new Date(a.utcDate)-new Date(b.utcDate)).forEach(m=>{let h=r[m.home.id]||1500,a=r[m.away.id]||1500,e=1/(1+10**(-((h+65)-a)/400)),s=m.score.home>m.score.away?1:m.score.home===m.score.away?.5:0,gd=Math.min(2,1+Math.abs(m.score.home-m.score.away)*.15),d=20*gd*(s-e);r[m.home.id]=h+d;r[m.away.id]=a-d});return r}function form(id){let a=data.finished.filter(m=>m.home.id===id||m.away.id===id).sort((x,y)=>new Date(y.utcDate)-new Date(x.utcDate)).slice(0,12);if(!a.length)return null;let gf=0,ga=0,w=0;a.forEach((m,i)=>{let wt=Math.exp(-.14*i),ho=m.home.id===id;gf+=(ho?m.score.home:m.score.away)*wt;ga+=(ho?m.score.away:m.score.home)*wt;w+=wt});return{gf:gf/w,ga:ga/w,n:a.length}}function om(g){return odds.find(o=>norm(o.home)===norm(g.home.name)&&norm(o.away)===norm(g.away.name))||null}function rows(o){let a=[];for(let b of o?.bookmakers||[])for(let m of b.markets||[])for(let x of m.outcomes||[])a.push({book:b.title,market:m.key,name:x.name,price:+x.price,point:x.point,last:b.last_update});return a}function market(g,o){let a=rows(o).filter(x=>x.market==='h2h'),v=[[],[],[]];a.forEach(x=>v[x.name==='Draw'?1:norm(x.name)===norm(g.home.name)?0:2].push(x.price));let av=z=>z.length?z.reduce((s,x)=>s+x,0)/z.length:null,od=v.map(av);if(!od.every(Boolean))return null;let q=od.map(x=>1/x),s=q.reduce((x,y)=>x+y),all=a.map(x=>x.price),books=new Set(a.map(x=>x.book)).size;return{p:q.map(x=>x/s),od,books,disp:all.length?(Math.max(...all)-Math.min(...all)):0}}function calibration(){let a=choices.filter(x=>x.status==='settled'&&x.probs),n=a.length;if(!n)return{n:0,brier:null,ll:null,bins:{},factor:1};let br=0,ll=0,bins={};a.forEach(x=>{let i=x.actual,pr=x.probs;br+=pr.reduce((s,p,j)=>s+(p-(i===j?1:0))**2,0);ll+=-Math.log(Math.max(pr[i],1e-8));let c=Math.max(...pr),k=Math.floor(c*10)*10;(bins[k]??=[]).push(x)});return{n,brier:br/n,ll:ll/n,bins,factor:n>=30?Math.max(.85,Math.min(1.05,1-(br/n-.55)*.18)):1}}function predict(g,E,C){let hf=form(g.home.id),af=form(g.away.id),ed=(E[g.home.id]||1500)-(E[g.away.id]||1500),x=hf&&af?Math.max(.25,(hf.gf+af.ga)/2*1.08):1.4,y=hf&&af?Math.max(.25,(af.gf+hf.ga)/2*.92):1.2;x*=Math.exp(ed/400*.14);y*=Math.exp(-ed/400*.14);let m=matrix(x,y),p=[0,0,0],sc=[],tot=Array(17).fill(0),bt=0;for(l ><b>历史校准</b>：样本${a.cal.n}，${a.cal.brier==null?'暂无':`Brier ${a.cal.brier.toFixed(3)} / LogLoss ${a.cal.ll.toFixed(3)}`}。<br><b>评分构成</b>：Elo ${a.comps.elo.toFixed(1)}，市场一致 ${a.comps.market.toFixed(1)}，赔率分歧 ${a.comps.disp.toFixed(1)}，数据完整 ${a.comps.data.toFixed(1)}，方向清晰 ${a.comps.clarity.toFixed(1)}，历史校准 ${a.comps.cal.toFixed(1)}。</details><div class="choice"><select id="sel-${g.id}">${gr.map(x=>`<optgroup label="${x}">${op.filter(y=>y[0]===x).map(y=>`<option value="${y[1]}">${y[2]}</option>`).join('')}</optgroup>`).join('')}</select><input id="sp-${g.id}" type="number" step=".01" placeholder="SP"><input id="st-${g.id}" type="number" value="${cfg.stake}"><button onclick="add('${g.id}')">加入我的选择</button></div></article>`}async function translateAll(){let n=[...new Set(data.upcoming.flatMap(x=>[x.home.name,x.away.name,x.competition.name]).filter(x=>x&&!TR[x]))];if(!n.length)return;try{let j=await fetch('/api/translate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({texts:n})}).then(r=>r.json());Object.assign(TR,j.translations||{})}catch{}}async function refreshAll(){try{$('#log').textContent='正在更新融合模型...';let[a,b]=await Promise.all([fetch('/api/app-data').then(r=>r.json()),fetch('/api/odds').then(r=>r.json())]);if(a.error)throw Error(a.error);data=a;odds=b.events||[];let E=dynamicElo(),C=calibration();data.upcoming.forEach(g=>{let o=om(g),mk=market(g,o);if(o&&mk){(hist[o.id]??=[]).push({t:Date.now(),p:mk.p});hist[o.id]=hist[o.id].slice(-40)}});await translateAll();save();filters();render();$('#log').textContent=`完成：赛事${data.upcoming.length}，历史赛果${data.finished.length}，赔率赛事${odds.length}，校准样本${C.n}`}catch(e){$('#log').textContent='更新失败：'+e.message}}function filtered(){let E=dynamicElo(),C=calibration(),q=$('#q').value.toLowerCase(),l=$('#leagueF').value,s=$('#sortF').value,a=data.upcoming.map(g=>({g,a:predict(g,E,C)})).filter(z=>(z.g.home.name+z.g.away.name+nm(z.g.home.name)+nm(z.g.away.name)).toLowerCase().includes(q)).filter(z=>l==='all'||z.g.competition.code===l);a.sort((x,y)=>s==='risk'?y.a.risk-x.a.risk:s==='edge'?y.a.edge-x.a.edge:s==='time'?new Date(x.g.utcDate)-new Date(y.g.utcDate):y.a.score-x.a.score);return a}function add(id){let z=view.find(x=>String(x.g.id)===String(id)),sel=$('#sel-'+id),sp=+$('#sp-'+id).value,stake=+$('#st-'+id).value;if(!(sp>1))return alert('请输入有效SP');choices.push({id:crypto.randomUUID(),matchId:String(id),home:z.g.home.name,away:z.g.away.name,label:sel.options[sel.selectedIndex].text,market:sel.value,sp,stake,probs:z.a.blend,model:z.a.primary,risk:z.a.risk,hcp:cfg.hcp,status:'pending',checked:false});save();render()}function settle(){let n=0;for(let c of choices.filter(x=>x.status==='pending')){let r=data.finished.find(x=>String(x.id)===c.matchId);if(!r)continue;let h=+r.score.home,a=+r.score.away,p=c.market.split('|'),actual=h>a?0:h===a?1:2,hit=false;if(p[0]==='h2h')hit=+p[1]===actual;if(p[0]==='rq')hit=+p[1]===(h+c.hcp>a?0:h+c.hcp===a?1:2);if(p[0]==='score')hit=h===+p[1]&&a===+p[2];if(p[0]==='goals')hit=+p[1]>=7?h+a>=7:h+a===+p[1];if(p[0]==='ou')hit=p[1]==='over'?h+a>+p[2]:h+a<+p[2];if(p[0]==='btts')hit=(p[1]==='yes')===Boolean(h&&a);if(p[0]==='dc')hit=p[1]==='best'?c.model===(actual===0?'主胜':actual===1?'平局':'客胜'):false;Object.assign(c,{status:'settled',actual,hit,profit:hit?c.stake*(c.sp-1):-c.stake});n++}save();render();alert('结算'+n+'项')}function perf(a){let z=a.filter(x=>x.status==='settled'),inv=z.reduce((s,x)=>s+x.stake,0),profit=z.reduce((s,x)=>s+x.profit,0);return{n:z.length,inv,profit,roi:inv?profit/inv:0,hit:z.length?z.filter(x=>x.hit).length/z.length:0}}function combo(){let a=choices.filter(x=>x.checked&&x.status==='pending'),st=+$('#comboStake').value||0,sp=a.reduce((s,x)=>s*x.sp,1);$('#comboText').textContent=a.length?`组合SP ${sp.toFixed(3)} · 返还 ${(sp*st).toFixed(2)} · 盈利 ${(sp*st-st).toFixed(2)}`:'请勾选'}function render(){view=filtered();$('#stats').innerHTML=[['赛事',view.length],['高分',view.filter(x=>x.a.score>=78).length],['高风险',view.filter(x=>x.a.risk>=70).length],['赔率匹配',view.filter(x=>x.a.mk).length]].map(x=>`<div class="stat"><b>${x[1]}</b><small>${x[0]}</small></div>`).join('');$('#list').innerHTML=view.map(card).join('')||'<div class="empty">暂无赛事</div>';let p=perf(choices);$('#mineStats').innerHTML=[['待结算',choices.filter(x=>x.status==='pending').length],['已结算',p.n],['盈亏',p.profit.toFixed(2)],['ROI',(p.roi*100).toFixed(1)+'%']].map(x=>`<div class="stat"><b>${x[1]}</b><small>${x[0]}</small></div>`).join('');$('#choiceTable').innerHTML='<tr><th>组合</th><th>比赛</th><th>选择</th><th>SP</th><th>投入</th><th>状态</th><th>盈亏</th></tr>'+choices.map(c=>`<tr><td><input type="checkbox" ${c.checked?'checked':''} onchange="choices.find(x=>x.id==='${c.id}').checked=this.checked;save()"></td><td>${nm(c.home)} VS ${nm(c.away)}</td><td>${c.label}</td><td>${c.sp}</td><td>${c.stake}</td><td>${c.status}</td><td>${c.status==='settled'?c.profit.toFixed(2):'—'}</td></tr>`).join('');renderCal()}function renderCal(){let c=calibration();$('#calStats').innerHTML=[['样本',c.n],['Brier',c.brier==null?'—':c.brier.toFixed(3)],['Log Loss',c.ll==null?'—':c.ll.toFixed(3)],['校准状态',c.n>=30?'已启用':'观察中']].map(x=>`<div class="stat"><b>${x[1]}</b><small>${x[0]}</small></div>`).join('');$('#calTable').innerHTML='<tr><th>置信区间</th><th>样本</th><th>预测均值</th><th>实际命中</th></tr>'+Object.entries(c.bins).map(([k,v])=>`<tr><td>${k}-${+k+9}%</td><td>${v.length}</td><td>${(v.reduce((s,x)=>s+Math.max(...x.probs),0)/v.length*100).toFixed(1)}%</td><td>${(v.filter(x=>x.hit).length/v.length*100).toFixed(1)}%</td></tr>`).join('')}function filters(){let old=$('#leagueF').value,ls=[...new Map(data.upcoming.map(x=>[x.competition.code,x.competition.name])).entries()];$('#leagueF').innerHTML='<option value="all">全部联赛</option>'+ls.map(x=>`<option value="${x[0]}">${nm(x[1])}</option>`).join('');if(ls.some(x=>x[0]===old))$('#leagueF').value=old}function saveCfg(){cfg={lang:$('#lang').value,stake:+$('#stake').value||100,hcp:+$('#hcp').value,marketW:+$('#marketW').value};save();filters();render()}$$('.tab').forEach(x=>x.onclick=()=>{$$('.tab,.page').forEach(y=>y.classList.remove('on'));x.classList.add('on');$('#'+x.dataset.p).classList.add('on')});['q','leagueF','sortF'].forEach(x=>$('#'+x).oninput=render);$('#lang').value=cfg.lang;$('#stake').value=cfg.stake;$('#hcp').value=cfg.hcp;$('#marketW').value=cfg.marketW;filters();render();
</script></body></html>
