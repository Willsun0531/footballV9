const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],K={cfg:'v10c',data:'v10d',odds:'v10o',hist:'v10h',choices:'v10x'};let cfg=JSON.parse(localStorage.getItem(K.cfg)||'{"lang":"cn","threshold":78,"stake":100,"handicap":-1}'),store=JSON.parse(localStorage.getItem(K.data)||'{"upcoming":[],"finished":[]}'),odds=JSON.parse(localStorage.getItem(K.odds)||'[]'),hist=JSON.parse(localStorage.getItem(K.hist)||'{}'),choices=JSON.parse(localStorage.getItem(K.choices)||'[]'),view=[];function save(){localStorage.setItem(K.cfg,JSON.stringify(cfg));localStorage.setItem(K.data,JSON.stringify(store));localStorage.setItem(K.odds,JSON.stringify(odds));localStorage.setItem(K.hist,JSON.stringify(hist));localStorage.setItem(K.choices,JSON.stringify(choices))}const CN={"Manchester City FC":"曼彻斯特城","Arsenal FC":"阿森纳","Liverpool FC":"利物浦","Chelsea FC":"切尔西","Manchester United FC":"曼彻斯特联","Real Madrid CF":"皇家马德里","FC Barcelona":"巴塞罗那","FC Bayern München":"拜仁慕尼黑","Borussia Dortmund":"多特蒙德","Paris Saint-Germain FC":"巴黎圣日耳曼","Juventus FC":"尤文图斯","AC Milan":"AC米兰","FC Internazionale Milano":"国际米兰","Premier League":"英格兰超级联赛","Primera Division":"西班牙甲级联赛","Bundesliga":"德国甲级联赛","Serie A":"意大利甲级联赛","Ligue 1":"法国甲级联赛","UEFA Champions League":"欧洲冠军联赛","Campeonato Brasileiro Série A":"巴西甲级联赛"};function nm(x){let c=CN[x];return cfg.lang==='en'?x:cfg.lang==='bi'&&c?`${c} (${x})`:c||x}function norm(s){return String(s||'').toLowerCase().replace(/fc|cf|club|\s|[-.'’]/g,'')}function fact(n){let z=1;for(let i=2;i<=n;i++)z*=i;return z}function po(l,k){return Math.exp(-l)*l**k/fact(k)}function tau(h,a,x,y,r=-.08){if(!h&&!a)return 1-x*y*r;if(!h&&a===1)return 1+x*r;if(h===1&&!a)return 1+y*r;if(h===1&&a===1)return 1-r;return 1}function matrix(x,y){let m=[],s=0;for(let h=0;h<9;h++){m[h]=[];for(let a=0;a<9;a++)s+=(m[h][a]=Math.max(0,po(x,h)*po(y,a)*tau(h,a,x,y)))}for(let h=0;h<9;h++)for(let a=0;a<9;a++)m[h][a]/=s;return m}function form(id){let a=store.finished.filter(m=>m.home.id===id||m.away.i {t:Date.now(),fav:Math.max(...mk.p),p:mk.p});hist[o.id]=hist[o.id].slice(-30)}}save();filters();render();$('#log').textContent=`赛事${store.upcoming.length}，赔率赛事${odds.length}，更新成功`}catch(e){$('#log').textContent='更新失败：'+e.message}}function filtered(){let ids=[...new Set(store.finished.flatMap(x=>[x.home.id,x.away.id]))],ratings=elo(ids),q=$('#q').value.toLowerCase(),l=$('#leagueF').value,g=$('#gradeF').value,s=$('#sortF').value,a=store.upcoming.map(x=>({g:x,a:predict(x,ratings)})).filter(x=>(x.g.competition.name+x.g.home.name+x.g.away.name).toLowerCase().includes(q)).filter(x=>l==='all'||x.g.competition.code===l).filter(x=>g==='all'||x.a.grade===g);a.sort((x,y)=>s==='risk'?y.a.risk-x.a.risk:s==='time'?new Date(x.g.utcDate)-new Date(y.g.utcDate):s==='gx'?(y.a.x+y.a.y)-(x.a.x+x.a.y):y.a.score-x.a.score);return a}function add(id){let z=view.find(x=>String(x.g.id)===String(id)),sel=$('#sel-'+id),sp=+$('#sp-'+id).value,stake=+$('#stake-'+id).value;if(!(sp>1))return alert('请输入有效SP');choices.push({id:crypto.randomUUID(),matchId:String(id),league:z.g.competition.name,home:z.g.home.name,away:z.g.away.name,time:z.g.utcDate,market:sel.value,selection:sel.options[sel.selectedIndex].text,sp,stake,model:z.a.primary,score:z.a.score,risk:z.a.risk,handicap:z.a.handicap,status:'pending',checked:false});save();render()}function settle(){let n=0;for(let c of choices.filter(x=>x.status==='pending')){let r=store.finished.find(x=>String(x.id)===c.matchId);if(!r)continue;let h=+r.score.home,a=+r.score.away,hit=false;if(c.market.startsWith('h2h|')){let t=c.market.split('|')[1];hit=t==='Draw'?h===a:t==='model'?c.model===(h>a?'主胜':h===a?'平局':'客胜'):norm(t)===norm(r.home.name)?h>a:h<a}else if(c.market.startsWith('rq|')){let i=+c.market.split('|')[1],res=h+c.handicap>a?0:h+c.handicap===a?1:2;hit=i===res}else if(c.market.startsWith('spread|')){let [,t,p]=c.market.split('|'),adj=norm(t)===norm(r.home.name)?h+(+p):a+(+p),opp=norm(t)===norm(r.home.name)?a:h;hit=adj>opp}else if(c.market.startsWith('to ><td>${c.model}/${c.risk}</td><td>${c.status}</td><td>${c.status==='settled'?c.profit.toFixed(2):'—'}</td><td><button onclick="remove('${c.id}')">删除</button></td></tr>`).join('');review()}function review(){let p=perf(choices);$('#reviewStats').innerHTML=[['累计投入',p.inv.toFixed(2)],['累计盈亏',p.profit.toFixed(2)],['命中率',(p.hit*100).toFixed(1)+'%'],['最大回撤',p.dd.toFixed(2)]].map(x=>`<div class="stat"><b>${x[1]}</b><small>${x[0]}</small></div>`).join('');function groups(fn){let g={};choices.forEach(x=>(g[fn(x)]??=[]).push(x));return Object.entries(g).map(([k,v])=>[k,perf(v)])}function rows(g){return g.map(([k,z])=>`<tr><td>${k}</td><td>${z.n}</td><td>${(z.hit*100).toFixed(1)}%</td><td>${z.profit.toFixed(2)}</td><td>${(z.roi*100).toFixed(1)}%</td></tr>`).join('')}$('#marketTable').innerHTML='<tr><th>市场</th><th>场次</th><th>命中</th><th>盈亏</th><th>ROI</th></tr>'+rows(groups(x=>x.market.split('|')[0]));$('#spTable').innerHTML='<tr><th>SP区间</th><th>场次</th><th>命中</th><th>盈亏</th><th>ROI</th></tr>'+rows(groups(x=>x.sp<1.5?'1.00-1.49':x.sp<1.8?'1.50-1.79':x.sp<2.2?'1.80-2.19':x.sp<3?'2.20-2.99':'3.00+'))}function filters(){let old=$('#leagueF').value,ls=[...new Map(store.upcoming.map(x=>[x.competition.code,x.competition.name])).entries()];$('#leagueF').innerHTML='<option value="all">全部联赛</option>'+ls.map(x=>`<option value="${x[0]}">${nm(x[1])}</option>`).join('');if(ls.some(x=>x[0]===old))$('#leagueF').value=old}function resetF(){$('#q').value='';$('#leagueF').value=$('#gradeF').value='all';$('#sortF').value='score';render()}function saveCfg(){cfg={lang:$('#lang').value,threshold:+$('#threshold').value||78,stake:+$('#stakeDefault').value||100,handicap:+$('#handicapDefault').value};save();filters();render()}$$('.tab').forEach(x=>x.onclick=()=>{$$('.tab,.page').forEach(y=>y.classList.remove('on'));x.classList.add('on');$('#'+x.dataset.p).classList.add('on')});['q','leagueF','gradeF','sortF'].forEach(x=>$('#'+x).oninput=render);$('#lang').value=cfg.lang;$('#threshold').value=cfg.threshold;$('#stakeDefault').value=cfg.stake;$('#handicapDefault').value=cfg.handicap;filters();render();
