<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football AI Pro V16.2 Market Intelligence</title><style>

.d{color:#75afff}.a{color:#42dda9}.mini{grid-template-columns:repeat(4,1fr);margin-top:8px}.mini span,.intel-cell span{display:block;font-size:11px;color:#8994ad}.extra{grid-template-columns:1fr 1fr;margin-top:8px}.extra>div{text-align:left}.extra b{display:block;margin-bottom:5px}.odds{display:flex;gap:7px;margin-top:8px}.odds span{flex:1}.intel{margin-top:9px;padding:10px;border-radius:11px;background:#0d1220;border:1px solid #293652}.intel-head{display:flex;justify-content:space-between}.intel-grid{grid-template-columns:repeat(3,1fr);margin-top:8px}.heat-low{color:var(--green)}.heat-mid{color:var(--amber)}.heat-high,.draw-warn{color:#ff6b7f}.foot{color:#b9c4dd;margin-top:8px;line-height:1.55}.tiny{font-size:11px;color:#7f8aa5}.empty{grid-column:1/-1;text-align:center;padding:45px;color:var(--muted)}.notice{margin-top:13px;border-left:3px solid var(--amber);padding-left:11px;color:#d7c991}@media(max-width:1150px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr}.intel-grid,.mini{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="wrap"><div class="head"><div><h1>Football AI Pro</h1><div class="sub">体彩赛事优先 · 欧指亚指联动 · 市场热度代理 · 概率研究</div></div><div class="badge">V16.2 Market Intelligence</div></div><div class="toolbar"><button id="refresh">刷新赛事与市场</button><select id="days"><option value="1">1天</option><option value="2" selected>2天</option><option value="3">3天</option><option value="7">7天</option></select><input id="q" placeholder="搜索球队或联赛"></div><section id="stats" class="stats"></section><details class="diag"><summary>数据源诊断（仅排查场次时展开）</summary><pre id="log"></pre></details><div class="notice">市场热度为赔率变化、多公司共识及模型市场背离的代理指标，不是官方投注金额或全国资金比例。页面仅用于数据研究与复盘。</div><section id="list" class="grid"></section></main><script>
const $=s=>document.querySelector(s);let state={matches:[],meta:{}};const num=v=>Number.isFinite(+v)?+v:null,pct=v=>Number.isFinite(v)?(v*100).toFixed(1)+'%':'—';
async function json(url){const r=await fetch(url,{cache:'no-store'}),t=await r.text();let j;try{j=JSON.parse(t)}catch{throw Error(url+' 非JSON: '+t.slice(0,80))}if(!r.ok)throw Error(j.error||('HTTP '+r.status));return j}
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\b(fc|sc|cf|ec|afc|club|fk|ff)\b/g,'').replace(/[^a-z0-9\u4e00-\u9fff]/g,'')}
function same(a,b){const n1=norm(a.home?.name),n2=norm(a.away?.name),m1=norm(b.home?.name),m2=norm(b.away?.name),dt=Math.abs(new Date(a.utcDate)-new Date(b.utcDate));return n1&&n2&&m1&&m2&&(n1.includes(m1)||m1.includes(n1))&&(n2.includes(m2)||m2.includes(n2))&&dt<=12*3600000}
function merge(xs){const out=[];for(const a of xs)for(const m of a||[])if(!out.some(x=>same(x,m)))out.push(m);return out}
function fact(k){let x=1;for(let i=2;i<=k;i++)x*=i;return x}function pois(k,l){return Math.exp(-l)*l**k/fact(k)}
function matrix(lh,la){const a=[];let sum=0;const rho=-.08;for(let h=0;h<=8;h++)for(let g=0;g<=8;g++){let p=pois(h,lh)*pois(g,la);if(h===0&&g===0)p*=1-lh*la*rho;if(h===0&&g===1)p*=1+lh*rho;if(h===1&&g===0)p*=1+la*rho;if(h===1&&g===1)p*=1-rho;a.push({h,g,p});sum+=p}a.forEach(x=>x.p/=sum);return a}
function model(m){const mp=m.modelProbability||m.probabilities||{};let p=[num(mp.home),num(mp.draw),num(mp.away)];const lh=Math.max(.1,num(m.gxHome)||num(m.homeGX)||1.35),la=Math.max(.1,num(m.gxAway)||num(m.awayGX)||1.17),mx=matrix(lh,la);if(!p.every(Number.isFinite)){p=[0,0,0];for(const x of mx)p[x.h>x.g?0:x.h===x.g?1:2]+=x.p}else{const s=p.reduce((a,b)=>a+b,0);p=p.map(x=>x/s)}const scores=[...mx].sort((x,y)=>y.p-x.p).slice(0,5),tot=Array(8).fill(0);for(const x of mx)tot[Math.min(7,x.h+x.g)]+=x.p;const btts=mx.filter(x=>x.h>0&&x.g>0).reduce((a,b)=>a+b.p,0);return{p,lh,la,mx,scores,tot,btts}}
function mean(a){const v=a.filter(Number.isFinite);return v.length?v.reduce((x,y)=>x+y,0)/v.length:null}function sd(a){const m=mean(a);return m==null?null:Math.sqrt(mean(a.filter(Number.isFinite).map(x=>(x-m)**2)))}function mode(a){const c={};for(const x of a.filter(Number.isFinite)){const k=(Math.round(x*4)/4).toFixed(2);c[k]=(c[k]||0)+1}const k=Object.keys(c).sort((x,y)=>c[y]-c[x])[0];return k==null?null:+k}
function pack(m){const bs=m.oddsEvent?.bookmakers||[],h=[[],[],[]],sp=[],to=[];for(const b of bs)for(const mk of b.markets||[]){if(mk.key==='h2h')for(const o of mk.outcomes||[]){const k=norm(o.name);if(k===norm(m.home.name))h[0].push(+o.price);else if(k===norm(m.away.name))h[2].push(+o.price);else if(k==='draw')h[1].push(+o.price)}if(mk.key==='spreads')for(const o of mk.outcomes||[])sp.push({name:o.name,point:+o.point,price:+o.price,book:b.title||b.key});if(mk.key==='totals')for(const o of mk.outcomes||[])to.push({name:o.name,point:+o.point,price:+o.price})}const avg=h.map(mean),iv=avg.map(x=>x?1/x:0),ss=iv.reduce((a,b)=>a+b,0),imp=ss?iv.map(x=>x/ss):null,hsp=sp.filter(x=>norm(x.name)===norm(m.home.name)),pt=mode(hsp.map(x=>x.point)),hp=hsp.filter(x=>pt!=null&&Math.abs(x.point-pt)<.01),ap=sp.filter(x=>norm(x.name)===norm(m.away.name)&&pt!=null&&Math.abs(x.point+pt)<.01),tp=mode(to.map(x=>x.point)),ov=to.filter(x=>/^over$/i.test(x.name)&&Math.abs(x.point-tp)<.01),un=to.filter(x=>/^under$/i.test(x.name)&&Math.abs(x.point-tp)<.01),disp=mean(h.map(x=>{const m=mean(x),d=sd(x);return m&&d!=null?d/m:null}).filter(Number.isFinite));return{avg,imp,books:bs.length,disp,spread:pt==null?null:{point:pt,home:mean(hp.map(x=>x.price)),away:mean(ap.map(x=>x.price))},total:tp==null?null:{point:tp,over:mean(ov.map(x=>x.price)),under:mean(un.map(x=>x.price))}}}
function sk(m){return'mkt_'+(m.oddsEvent?.id||m.id||norm(m.home?.name)+'_'+norm(m.away?.name)+'_'+m.utcDate)}function snap(m){const p=pack(m);if(!p.imp&&!p.spread)return;const k=sk(m),a=JSON.parse(localStorage.getItem(k)||'[]'),r={ts:Date.now(),avg:p.avg,imp:p.imp,spread:p.spread,total:p.total},last=a.at(-1);if(!last||Date.now()-last.ts>15*60000)a.push(r);else a[a.length-1]=r;localStorage.setItem(k,JSON.stringify(a.slice(-40)))}
function intel(m,z){const p=pack(m),a=JSON.parse(localStorage.getItem(sk(m))||'[]'),f=a[0],fav=p.imp?Math.max(...p.imp):null,fi=p.imp?p.imp.indexOf(fav):-1,mi=z.p.indexOf(Math.max(...z.p)),pm=f?.imp&&p.imp&&fi>=0?(p.imp[fi]-f.imp[fi])*100:null,fair=-(Math.round((z.lh-z.la)*4)/4),lm=f?.spread&&p.spread?p.spread.point-f.spread.point:null,wm=f?.spread?.home&&p.spread?.home?p.spread.home-f.spread.home:null,asia=p.spread?p.spread.point<-.24?0:p.spread.point>.24?2:1:null,ea=asia==null||fi<0?'未验证':(asia===fi||asia===1?'基本一致':'方向背离');let heat=fav==null?null:Math.max(0,Math.min(100,(fav-.33)*140+(pm||0)*2+(p.disp==null?0:Math.max(0,10-p.disp*100))));return{p,a,fair,lm,wm,pm,ea,heat,label:heat==null?'暂无':heat>=75?'高热代理':heat>=58?'偏热代理':'正常',mm:fi<0?'未验证':fi===mi?'一致':'背离'}}
const CN={'Bologna':'博洛尼亚','Lazio':'拉齐奥','Malmo FF':'马尔默','Djurgardens IF':'尤尔加登斯','Osasuna':'奥萨苏纳','Levante':'莱万特','Viking':'维京','Sarpsborg 08 FF':'萨普斯堡08'};function cn(x){return CN[x]||x}function no(m,i){return m.lotteryMatchNo||('非体彩·'+String(i+1).padStart(3,'0'))}
function render(){const q=norm($('#q').value),rows=state.matches.filter(m=>!q||norm((m.competition?.name||'')+(m.home?.name||'')+(m.away?.name||'')).includes(q)),t=state.meta;$('#stats').innerHTML=[['体彩开售',t.lottery||0],['合并展示',rows.length],['赔率匹配',t.matched||0],['API赛程',t.fixtures||0],['覆盖率',t.coverage==null?'—':t.coverage.toFixed(1)+'%']].map(x=>`<div class="stat"><b>${x[1]}</b><small>${x[0]}</small></div>`).join('');$('#list').innerHTML=rows.length?rows.map((m,i)=>{const z=model(m),pk=pack(m),it=intel(m,z),ord=[...z.p].sort((a,b)=>b-a),lead=ord[0]-ord[1],dw=z.p[1]>=.30||z.p[1]>=ord[0]-.07,go=z.tot.map((p,i)=>({i,p})).sort((a,b)=>b.p-a.p).slice(0,2),hc=it.heat==null?'':it.heat>=75?'heat-high':it.heat>=58?'heat-mid':'heat-low';return`<article class="card"><div class="topline"><div><span class="no">${no(m,i)}</span> <span class="league">${m.competition?.name||'未知联赛'}</span></div><span>${new Date(m.utcDate).toLocaleString('zh-CN',{timeZone:'Asia/Hong_Kong',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</span></div><div class="teams"><div><div class="cn">${cn(m.home.name)}</div>${cn(m.home.name)!==m.home.name?`<div class="en">${m.home.name}</div>`:''}</div><b>VS</b><div><div class="cn">${cn(m.away.name)}</div>${cn(m.away.name)!==m.away.name?`<div class="en">${m.away.name}</div>`:''}</div></div><div class="probbar"><i style="width:${z.p[0]*100}%;background:#fb7185"></i><i style="width:${z.p[1]*100}%;background:#68a9ff"></i><i style="width:${z.p[2]*100}%;background:#35d79f"></i></div><div class="probs"><div><b class="h">${pct(z.p[0])}</b>主胜</div><div><b class="d">${pct(z.p[1])}</b>平局</div><div><b class="a">${pct(z.p[2])}</b>客胜</div></div><div class="mini"><div><span>主队GX</span>${z.lh.toFixed(2)}</div><div><span>客队GX</span>${z.la.toFixed(2)}</div><div><span>首选领先</span>${(lead*100).toFixed(1)}pp</div><div><span>平局提示</span><b class="${dw?'draw-warn':''}">${dw?'平局警示':'常规'}</b></div></div><div class="extra"><div><b>🏆 扩展玩法 · 比分</b>${z.scores.slice(0,2).map((x,j)=>`推荐${j+1}：${x.h}:${x.g} ${pct(x.p)}`).join('<br>')}</div><div><b>📊 扩展玩法 · 总进球</b><span style="color:#5ee7f8;font-size:18px;font-weight:850">${go.map(x=>x.i===7?'7+':x.i).join('~')}个球</span><br>BTTS是 ${pct(z.btts)}</div></div><div class="odds"><span>主胜<br>@${pk.avg[0]?.toFixed(2)||'—'}</span><span>平局<br>@${pk.avg[1]?.toFixed(2)||'—'}</span><span>客胜<br>@${pk.avg[2]?.toFixed(2)||'—'}</span></div><div class="intel"><div class="intel-head"><b>欧指 · 亚指 · 市场热度代理</b><b class="${hc}">${it.label}${it.heat==null?'':' '+it.heat.toFixed(0)}</b></div><div class="intel-grid"><div class="intel-cell"><span>GX公平亚洲盘</span>主队 ${it.fair>0?'+'+it.fair:it.fair}</div><div class="intel-cell"><span>市场实际盘口</span>${pk.spread?`主队 ${pk.spread.point>0?'+':''}${pk.spread.point} @${pk.spread.home?.toFixed(2)||'—'}`:'暂无'}</div><div class="intel-cell"><span>欧亚一致性</span>${it.ea}</div><div class="intel-cell"><span>初盘→即时盘</span>${it.lm==null?'快照不足':`${it.lm<0?'升盘':it.lm>0?'降盘':'未变'} ${Math.abs(it.lm).toFixed(2)}`}</div><div class="intel-cell"><span>主队水位变化</span>${it.wm==null?'快照不足':`${it.wm>0?'升水':'降水'} ${Math.abs(it.wm).toFixed(2)}`}</div><div class="intel-cell"><span>欧指支持变化</span>${it.pm==null?'快照不足':`${it.pm>0?'+':''}${it.pm.toFixed(1)}pp`}</div></div><div class="foot">模型与市场：${it.mm} · 赔率快照：${it.a.length}次 · ${pk.total?`大小盘 ${pk.total.point}（大@${pk.total.over?.toFixed(2)||'—'} / 小@${pk.total.under?.toFixed(2)||'—'}）`:'暂无大小盘'}<div class="tiny">热度代理不等于真实投注金额。高热只表示市场定价集中或持续强化，需结合数据质量和模型背离谨慎解读。</div></div></div><div class="foot">比分Top 5：${z.scores.map(x=>`${x.h}:${x.g} ${pct(x.p)}`).join(' · ')}</div></article>`}).join(''):'<div class="card empty">当前范围没有赛事，请展开诊断查看数据源状态。</div>'}
async function refresh(){const days=$('#days').value;$('#refresh').disabled=true;const jobs=[['lottery',`/api/lottery-fixtures?days=${days}`],['fixtures',`/api/fixtures?days=${days}`],['odds','/api/odds'],['app','/api/app-data']],r=await Promise.allSettled(jobs.map(x=>json(x[1]))),g={};r.forEach((x,i)=>g[jobs[i][0]]=x.status==='fulfilled'?x.value:{error:x.reason.message});const lo=g.lottery.fixtures||[],fi=g.fixtures.upcoming||g.fixtures.fixtures||[],ap=g.app.upcoming||[],oe=g.odds.events||[],om=oe.map(e=>({id:'odds-'+e.id,utcDate:e.commenceTime,competition:{name:e.league||''},home:{name:e.home},away:{name:e.away},source:'odds'}));let all=merge([lo,fi,ap,om]),now=Date.now(),end=now+(+days)*86400000;all=all.filter(m=>{const x=new Date(m.utcDate).getTime(),st=String(m.status||'SCHEDULED').toUpperCase();return x>=now-15*60000&&x<=end&&!['FINISHED','FT','AET','PEN','CANCELLED','CANC'].includes(st)});let matched=0;for(const m of all){const o=oe.find(e=>same(m,{home:{name:e.home},away:{name:e.away},utcDate:e.commenceTime}));if(o){m.oddsEvent=o;matched++;snap(m)}}state.matches=all;state.meta={lottery:lo.length,fixtures:fi.length,matched,coverage:lo.length?all.filter(m=>lo.some(x=>same(m,x))).length/lo.length*100:null};$('#log').textContent=JSON.stringify({体彩:lo.length,API赛程:fi.length,主赛事:ap.length,赔率赛事:oe.length,合并展示:all.length,赔率匹配:matched,错误:Object.fromEntries(Object.entries(g).filter(x=>x[1].error).map(x=>[x[0],x[1].error]))},null,2);render();$('#refresh').disabled=false}
$('#refresh').onclick=refresh;$('#days').onchange=refresh;$('#q').oninput=render;render();refresh();
