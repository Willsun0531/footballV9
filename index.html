const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],K={cfg:'v95_cfg',data:'v95_data',choices:'v95_choices',odds:'v95_odds',hist:'v95_odds_hist'};function rd(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}}let cfg=rd(K.cfg,{lang:'cn',threshold:78,defaultStake:100}),store=rd(K.data,{upcoming:[],finished:[],source:'none'}),choices=rd(K.choices,[]),odds=rd(K.odds,[]),oddsHist=rd(K.hist,{}),view=[];function save(){localStorage.setItem(K.cfg,JSON.stringify(cfg));localStorage.setItem(K.data,JSON.stringify(store));localStorage.setItem(K.choices,JSON.stringify(choices));localStorage.setItem(K.odds,JSON.stringify(odds));localStorage.setItem(K.hist,JSON.stringify(oddsHist))}const CN={"Manchester City FC":"曼彻斯特城","Arsenal FC":"阿森纳","Liverpool FC":"利物浦","Chelsea FC":"切尔西","Manchester United FC":"曼彻斯特联","Tottenham Hotspur FC":"托特纳姆热刺","Real Madrid CF":"皇家马德里","FC Barcelona":"巴塞罗那","Club Atlético de Madrid":"马德里竞技","FC Bayern München":"拜仁慕尼黑","Borussia Dortmund":"多特蒙德","Paris Saint-Germain FC":"巴黎圣日耳曼","Juventus FC":"尤文图斯","AC Milan":"AC米兰","FC Internazionale Milano":"国际米兰","Premier League":"英格兰超级联赛","Primera Division":"西班牙甲级联赛","Bundesliga":"德国甲级联赛","Serie A":"意大利甲级联赛","Ligue 1":"法国甲级联赛","UEFA Champions League":"欧洲冠军联赛","Campeonato Brasileiro Série A":"巴西甲级联赛"};function name(x){let c=CN[x];return cfg.lang==='en'?x:cfg.lang==='bi'&&c?`${c} (${x})`:c||x}function log(s){$('#log').textContent+=new Date().toLocaleTimeString()+' '+s+'\n'}function fact(n){let r=1;for(let i=2;i<=n;i++)r*=i;return r}function pois(l,k){return Math.exp(-l)*l**k/fact(k)}function tau(h,a,x,y,r=-.08){if(!h&&!a)return 1-x*y*r;if(!h&&a===1)return 1+x*r;if(h===1&&!a)return 1+y*r;if(h===1&&a===1)return 1-r;return 1}function matrix(x,y){let m=[],s=0;for(let h=0;h<9;h++){m[h]=[];for(let a=0;a<9;a++)s+=(m[h][a]=Math.max(0,pois(x,h)*pois(y,a)*tau(h,a,x,y)))}for(let h=0;h<9;h++)for(let a=0;a<9;a++)m[h][a]/=s;return m}function form(id){let a=store.finished.filter(m=>m.home.id===id||m.away.id===id).slice(-8);if(!a.length)return null;let gf=0,ga=0;for(let m of a){let ho=m.home.id===id,h=+m.score.home,g=+m.score.away;gf+=ho?h:g;ga+=ho?g:h}return{gf:gf/a.length,ga:ga/a.length,n:a.length}}function pred(g){let hf=form(g.home.id),af=form(g.away.id),base=1.3,x=hf&&af?Math.max(.25,(hf.gf+af.ga)/2*1.08):1.4,y=hf&&af?Math.max(.25,(af.gf+hf.ga)/2*.92):1.2,m=matrix(x,y),p=[0,0,0],sc=[],tot=Array(17).fill(0);for(let h=0;h<9;h++)for(let a=0;a<9;a++){let v=m[h][a];p[h>a?0:h===a?1:2]+=v;sc.push([v,h,a]);tot[h+a]+=v}sc.sort((a,b)=>b[0]-a[0]);let r=[0,1,2].sort((a,b)=>p[b]-p[a]),labs=['主胜','平局','客胜'],score=Math.min(95,Math.max(45,Math.round(55+(p[r[0]]-p[r[1]])*150+(hf&&af?10:0)))),grade=score>=cfg.threshold?'A':score>=70?'B':score>=60?'C':'N';return{x,y,p,sc:sc.slice(0,3),primary:labs[r[0]],score,grade,band:x+y<2.35?'low':x+y<3.35?'mid':'high',over:1-tot[0]-tot[1]-tot[2]}}function norm(s){return String(s||'').toLowerCase().replace(/fc|cf|club|\s|[-.'’]/g,'')}function matchOdds(g){let best=null,bestSim=0;for(let o of odds){let sim=(norm(g.home.name)===norm(o.home)?1:0)+(norm(g.away.name)===norm(o.away)?1:0);if(sim>bestSim){best=o;bestSim=sim}}return bestSim>=2?best:null}function marketRows(g,o){if(!o)return[];let rows=[];for(let b of o.bookmakers||[])for(let m of b.markets||[])for(let x of m.outcomes||[])rows.push({book:b.title,market:m.key,name:x.name,price:+x.price,point:x.point,last:b.last_update});return rows}function bestPrices(g,o){let rows=marketRows(g,o),map={};for(let r of rows){let k=r.market+'|'+r.name+'|'+(r.point??'');if(!map[k]||r.price>map[k].price)map[k]=r}return Object.values(map)}function card(z){let g=z.g,a=z.a,o=z.o,rows=bestPrices(g,o),h2h=rows.filter(x=>x.market==='h2h'),spreads=rows.filter(x=>x.market==='spreads');let opts=[{v:'model',t:`模型：${a.primary}`,sp:h2h.find(x=>x.name===(a.primary==='主胜'?o?.home:a.primary==='客胜'?o?.away:'Draw'))?.price||''},...h2h.map(x=>({v:'h2h|'+x.name,t:`${x.name==='Draw'?'平局':name(x.name)} @ ${x.price}`,sp:x.price})),...spreads.map(x=>({v:'spreads|'+x.name+'|'+x.point,t:`让球 ${name(x.name)} ${x.point>0?'+':''}${x.point} @ ${x.price}`,sp:x.price}))];return`<article class="card"><div class="top"><span>${name(g.competition.name)} · ${g.competition.area}</span><span>${new Date(g.utcDate).toLocaleString('zh-CN')}</span></div><div class="teams">${name(g.home.name)} VS ${name(g.away.name)}</div><div class="model"><div class="mh"><b>${a.primary}</b><span class="grade ${a.grade}">${a.grade==='N'?'观察':a.grade+'级'} ${a.score}分</span></div>GX 主${a.x.toFixed(2)} · 客${a.y.toFixed(2)} · 总${(a.x+a.y).toFixed(2)}<div class="scores">${a.sc.map(s=>`<div class="score">${s[1]}:${s[2]}<br>${(s[0]*100).toFixed(1)}%</div>`).join('')}</div>${o?`赔率公司 ${o.bookmakers.length}家 · 最后更新 ${new Date(o.lastUpdate).toLocaleString('zh-CN')}`:'暂无国际赔率匹配'}</div><div class="choice"><select id="sel-${g.id}">${opts.map(x=>`<option value="${x.v}" data-sp="${x.sp}">${x.t}</option>`).join('')}</select><input id="sp-${g.id}" type="number" step="0.01" placeholder="SP" value="${opts[0]?.sp||''}"><input id="stake-${g.id}" type="number" value="${cfg.defaultStake}" placeholder="投入"><button onclick="addChoice('${g.id}')">加入我的选择</button></div></article>`}async function refreshAll(){try{log('更新赛事');let [a,b]=await Promise.all([fetch('/api/app-data').then(r=>r.json()),fetch('/api/odds').then(r=>r.json())]);if(a.error)throw Error(a.error);store=a;if(!b.error){odds=b.events||[];for(let e of odds){let k=e.id,avg=(e.bookmakers||[]).flatMap(x=>x.markets||[]).flatMap(x=>x.outcomes||[]).map(x=>x.price);(oddsHist[k]??=[]).push({t:Date.now(),avg:avg.length?avg.reduce((s,x)=>s+x,0)/avg.length:null});oddsHist[k]=oddsHist[k].slice(-30)}}else log('赔率：'+b.error);save();filters();render();log('更新完成')}catch(e){log('失败：'+e.message)}}function filtered(){let q=$('#search').value.toLowerCase(),l=$('#leagueF').value,gr=$('#gradeF').value,gf=$('#goalF').value,sort=$('#sortF').value;a=store.upcoming.map(g=>({g,a:pred(g),o:matchOdds(g)})).filter(z=>(z.g.competition.name+z.g.home.name+z.g.away.name).toLowerCase().includes(q)).filter(z=>l==='all'||z.g.competition.code===l).filter(z=>gr==='all'||z.a.grade===gr).filter(z=>gf==='all'||z.a.band===gf);a.sort((x,y)=>sort==='timeAsc'?new Date(x.g.utcDate)-new Date(y.g.utcDate):sort==='gxDesc'?(y.a.x+y.a.y)-(x.a.x+x.a.y):sort==='oddsDesc'?Math.max(...bestPrices(y.g,y.o).map(x=>x.price),0)-Math.max(...bestPrices(x.g,x.o).map(x=>x.price),0):y.a.score-x.a.score);return a}function addChoice(id){let z=view.find(x=>String(x.g.id)===String(id)),sel=$('#sel-'+id),sp=+$('#sp-'+id).value,stake=+$('#stake-'+id).value;if(!(sp>1&&stake>=0))return alert('请输入有效SP和模拟投入');let text=sel.options[sel.selectedIndex].text,market=sel.value,price=sp;choices.push({id:crypto.randomUUID(),matchId:String(id),competition:z.g.competition.name,home:z.g.home.name,away:z.g.away.name,time:z.g.utcDate,selection:text,market,sp:price,stake,modelPick:z.a.primary,score:z.a.score,status:'pending',createdAt:new Date().toISOString(),checked:false});save();render();alert('已加入我的选择')}function settleNow(){let n=0;for(let c of choices.filter(x=>x.status==='pending')){let r=store.finished.find(x=>String(x.id)===c.matchId);if(!r)continue;let h=+r.score.home,a=+r.score.away,hit=false;if(c.market==='model')hit=c.modelPick===(h>a?'主胜':h===a?'平局':'客胜');else if(c.market.startsWith('h2h|')){let t=c.market.split('|')[1];hit=t==='Draw'?h===a:t===r.home.name?h>a:h<a}else if(c.market.startsWith('spreads|')){let [,team,pt]=c.market.split('|'),adj=team===r.home.name?h+(+pt):a+(+pt),opp=team===r.home.name?a:h;hit=adj>opp}Object.assign(c,{status:'settled',hit,homeGoals:h,awayGoals:a,profit:hit?c.stake*(c.sp-1):-c.stake});n++}save();render();alert('结算'+n+'项')}function calcCombo(){let a=choices.filter(x=>x.checked&&x.status==='pending'),stake=+$('#comboStake').value||0,sp=a.reduce((s,x)=>s*x.sp,1),ret=stake*sp,profit=ret-stake;$('#comboResult').innerHTML=a.length?`已选${a.length}项 · 组合SP ${sp.toFixed(3)} · 模拟投入 ${stake.toFixed(2)} · 潜在返还 ${ret.toFixed(2)} · 潜在盈利 ${profit.toFixed(2)}`:'请先勾选待结算项目'}function removeChoice(id){choices=choices.filter(x=>x.id!==id);save();render()}function clearSettled(){choices=choices.filter(x=>x.status!=='settled');save();render()}function perf(a){let st=a.filter(x=>x.status==='settled'),invest=st.reduce((s,x)=>s+x.stake,0),profit=st.reduce((s,x)=>s+x.profit,0),eq=0,peak=0,dd=0;for(let x of st){eq+=x.profit;peak=Math.max(peak,eq);dd=Math.max(dd,peak-eq)}return{n:st.length,invest,profit,roi:invest?profit/invest:0,hit:st.length?st.filter(x=>x.hit).length/st.length:0,dd}}function render(){view=filtered();$('#todayStats').innerHTML=[['赛事',view.length],['A级',view.filter(x=>x.a.grade==='A').length],['已选',choices.length],['赔率匹配',view.filter(x=>x.o).length]].map(x=>`<div class="stat"><b>${x[1]}</b><small>${x[0]}</small></div>`).join('');$('#matches').innerHTML=view.map(card).join('')||'<div class="empty">当前筛选无赛事</div>';let p=perf(choices);$('#mineStats').innerHTML=[['待结算',choices.filter(x=>x.status==='pending').length],['已结算',p.n],['模拟盈亏',p.profit.toFixed(2)],['ROI',(p.roi*100).toFixed(1)+'%']].map(x=>`<div class="stat"><b>${x[1]}</b><small>${x[0]}</small></div>`).join('');$('#choiceTable').innerHTML='<tr><th>组合</th><th>比赛</th><th>选择</th><th>SP</th><th>投入</th><th>模型</th><th>差异</th><th>状态</th><th>盈亏</th><th></th></tr>'+choices.map(c=>`<tr><td><input type="checkbox" ${c.checked?'checked':''} onchange="choices.find(x=>x.id==='${c.id}').checked=this.checked;save()"></td><td>${name(c.home)} VS ${name(c.away)}</td><td>${c.selection}</td><td>${c.sp.toFixed(2)}</td><td>${c.stake.toFixed(2)}</td><td>${c.modelPick} ${c.score}分</td><td>${c.selection.includes(c.modelPick)?'一致':'不同'}</td><td>${c.status}</td><td class="${c.profit>=0?'good':'bad'}">${c.status==='settled'?c.profit.toFixed(2):'—'}</td><td><button onclick="removeChoice('${c.id}')">删除</button></td></tr>`).join('');renderReview()}function renderReview(){let p=perf(choices);$('#reviewStats').innerHTML=[['累计投入',p.invest.toFixed(2)],['累计盈亏',p.profit.toFixed(2)],['命中率',(p.hit*100).toFixed(1)+'%'],['最大回撤',p.dd.toFixed(2)]].map(x=>`<div class="stat"><b>${x[1]}</b><small>${x[0]}</small></div>`).join('');let group=(key,fn)=>{let g={};for(let x of choices)(g[fn(x)]??=[]).push(x);return g},lg=group('l',x=>x.competition),sg=group('s',x=>x.sp<1.5?'1.00-1.49':x.sp<1.8?'1.50-1.79':x.sp<2.2?'1.80-2.19':x.sp<3?'2.20-2.99':'3.00+');let rows=g=>Object.entries(g).map(([k,v])=>{let z=perf(v);return`<tr><td>${name(k)}</td><td>${z.n}</td><td>${(z.hit*100).toFixed(1)}%</td><td>${z.profit.toFixed(2)}</td><td>${(z.roi*100).toFixed(1)}%</td></tr>`}).join('');$('#leagueTable').innerHTML='<tr><th>联赛</th><th>场次</th><th>命中率</th><th>盈亏</th><th>ROI</th></tr>'+rows(lg);$('#spTable').innerHTML='<tr><th>SP区间</th><th>场次</th><th>命中率</th><th>盈亏</th><th>ROI</th></tr>'+rows(sg);$('#equityText').textContent=`累计投入 ${p.invest.toFixed(2)}；累计盈亏 ${p.profit.toFixed(2)}；模拟ROI ${(p.roi*100).toFixed(1)}%；最大回撤 ${p.dd.toFixed(2)}。`}function filters(){let old=$('#leagueF').value,ls=[...new Map(store.upcoming.map(x=>[x.competition.code,x.competition.name])).entries()];$('#leagueF').innerHTML='<option value="all">全部联赛</option>'+ls.map(x=>`<option value="${x[0]}">${name(x[1])}</option>`).join('');if(ls.some(x=>x[0]===old))$('#leagueF').value=old}function resetFilters(){$('#search').value='';$('#leagueF').value=$('#gradeF').value=$('#goalF').value='all';$('#sortF').value='scoreDesc';render()}function saveSettings(){cfg={lang:$('#lang').value,threshold:+$('#threshold').value||78,defaultStake:+$('#defaultStake').value||100};save();filters();render();alert('已保存')}$$('.tab').forEach(x=>x.onclick=()=>{$$('.tab,.page').forEach(y=>y.classList.remove('on'));x.classList.add('on');$('#'+x.dataset.p).classList.add('on');render()});['search','leagueF','gradeF','goalF','sortF'].forEach(x=>$('#'+x).oninput=render);$('#comboStake').oninput=calcCombo;$('#lang').value=cfg.lang;$('#threshold').value=cfg.threshold;$('#defaultStake').value=c
