<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football AI Pro V10.1</title><style>body{margin:0;background:#080b18;color:#eef2ff;font:14px system-ui}.app{max-width:1000px;margin:auto;padding:14px}.box,.card{background:#141a2e;border:1px solid #303a58;border-radius:14px;padding:12px;margin:10px 0}button,input,select{background:#0c1222;color:#fff;border:1px solid #34405f;border-radius:8px;padding:9px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tabs{display:flex;gap:6px}.tab{flex:1}.on{background:#6b4be2}.page{display:none}.page.on{display:block}.teams{text-align:center;font-size:18px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.mini{background:#0c1222;padding:8px;text-align:center;border-radius:8px}.mini b{display:block;font-size:17px}.muted{color:#98a4bf;font-size:11px}.exp{line-height:1.7;font-size:12px}.choice{display:grid;grid-template-columns:1fr 90px 90px auto;gap:6px}.table{overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #303a58;white-space:nowrap}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.choice{grid-template-columns:1fr 1fr}}</style></head><body><main class="app"><h2>⚽ Football AI Pro <small>V10.1 Complete</small></h2><div class="box muted">完整市场 · 可解释Elo/GX/冷门风险 · 动态球队汉化 · 模拟选择与复盘</div><nav class="tabs"><button class="tab on" data-p="today">今日赛事</button><button class="tab" data-p="mine">我的选择</button><button class="tab" data-p="settings">设置</button></nav><section id="today" class="page on"><div class="box row"><button onclick="refreshAll()">更新赛事、赔率与汉化</button><select id="sort"><option value="score">推荐分高到低</option><option value="risk">冷门风险高到低</option></select><input id="q" placeholder="搜索球队"></div><div id="list"></div></section><section id="mine" class="page"><div class="box row"><label>组合投入<input id="comboStake" type="number" value="100"></label><button onclick="combo()">计算组合</button><button onclick="settle()">按赛果结算</button><span id="comboText"></span></div><div class="box table"><table id="choiceTable"></table></div></section><section id="settings" class="page"><div class="box row"><select id="lang"><option value="cn">中文优先</option><option value="bi">中英双语</option><option value="en">英文</option></select><label>让球值<input id="handicap" type="number" value="-1"></label><label>默认投入<input id="stake" type="number" value="100"></label><button onclick="saveCfg()">保存</button></div><div id="log" class="box muted"></div></section></main><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let cfg=JSON.parse(localStorage.v101cfg||'{"lang":"cn","handicap":-1,"stake":100}'),data=JSON.parse(localStorage.v101data||'{"upcoming":[],"finished":[]}'),odds=JSON.parse(localStorage.v101odds||'[]'),choices=JSON.parse(localStorage.v101choices||'[]'),TR=JSON.parse(localStorage.v101tr||'{}'),view=[];Object.assign(TR,{"EC Vitória":"维多利亚","SE Palmeiras":"帕尔梅拉斯","Coritiba FBC":"科里蒂巴","Cruzeiro EC":"克鲁塞罗","Manchester City FC":"曼彻斯特城","Arsenal FC":"阿森纳","Liverpool FC":"利物浦","Real Madrid CF":"皇家马德里","FC Barcelona":"巴塞罗那","Premier League":"英格兰超级联赛","Campeonato Brasileiro Série A":"巴西甲级联赛"});function save(){localStorage.v101cfg=JSON.stringify(cfg);localStorage.v101data=JSON.stringify(data);localStorage.v101odds=JSON.stringify(odds);localStorage.v101choices=JSON.stringify(choices);localStorage.v101tr=JSON.stringify(TR)}function nm(x){let c=TR[x];return cfg.lang==='en'?x:cfg.lang==='bi'&&c?c+' ('+x+')':c||x}function f(n){let z=1;for(let i=2;i<=n;i++)z*=i;return z}function po(l,k){return Math.exp(-l)*l**k/f(k)}function matrix(x,y){let m=[],s=0;for(let h=0;h<8;h++){m[h]=[];for(let a=0;a<8;a++)s+=(m[h][a]=po(x,h)*po(y,a))}for(let h=0;h<8;h++)for(let a=0;a<8;a++)m[h][a]/=s;return m}function form(id){let a=data.finished.filter(x=>x.home.id===id||x.away.id===id).slice(-8);if(!a.length)return null;let gf=0,ga=0;a.forEach(x=>{let h=x.home.id===id;gf+=h?x.score.home:x.score.away;ga+=h?x.score.away:x.score.home});return{gf:gf/a.length,ga:ga/a.length}}function model(g){let h=form(g.home.id),a=form(g.away.id),x=h&&a?(h.gf+a.ga)/2*1.08:1.4,y=h&&a?(a.gf+h.ga)/2*.92:1.2,m=matrix(x,y),p=[0,0,0],sc=[],tot=Array(15).fill(0),bt=0;for(let i=0;i<8;i++)for(let j=0;j<8;j++){let v=m[i][j];p[i>j?0:i===j?1:2]+=v;tot[i+j]+=v;sc.push([v,i,j]);if(i&&j)bt+=v}sc.sort((a,b)=>b[0]-a[0]);let r=[0,1,2].sort((i,j)=>p[j]-p[i]),labs=['主胜','平局','客胜'],score=Math.round(55+(p[r[0]]-p[r[1]])*150+(h&&a?8:0)),risk=Math.round(Math.min(100,(1-p[r[0]])*55+p[1]*70)),hp=[0,0,0];for(let i=0;i<8;i++)for(let j=0;j<8;j++)hp[i+cfg.handicap>j?0:i+cfg.handicap===j?1:2]+=m[i][j];return{x,y,p,sc:sc.slice(0,5),tot,bt,primary:labs[r[0]],score,risk,hp,elo:0}}function opts(g,a){let o=[];[['主胜',0],['平局',1],['客胜',2]].forEach(x=>o.push(['常规胜平负','h2h|'+x[1],x[0]+' · '+(a.p[x[1]]*100).toFixed(1)+'%']));['让胜','让平','让负'].forEach((x,i)=>o.push(['让球胜平负','rq|'+i,'主队'+cfg.handicap+' '+x+' · '+(a.hp[i]*100).toFixed(1)+'%']));a.sc.forEach(x=>o.push(['精确比分','score|'+x[1]+'|'+x[2],x[1]+':'+x[2]+' · '+(x[0]*100).toFixed(1)+'%']));for(let i=0;i<=6;i++)o.push(['总进球','goals|'+i,i+'球 · '+(a.tot[i]*100).toFixed(1)+'%']);[1.5,2.5,3.5].forEach(l=>{let u=a.tot.slice(0,Math.floor(l)+1).reduce((s,x)=>s+x,0);o.push(['大小球','ou|over|'+l,'大'+l+' · '+((1-u)*100).toFixed(1)+'%'],['大小球','ou|under|'+l,'小'+l+' · '+(u*100).toFixed(1)+'%'])});o.push(['双方进球','btts|yes','双方进球 是 · '+(a.bt*100).toFixed(1)+'%'],['双方进球','btts|no','双方进球 否 · '+((1-a.bt)*100).toFixed(1)+'%'],['双重机会','dc|1x','主胜或平局'],['双重机会','dc|12','主胜或客胜'],['双重机会','dc|x2','平局或客胜']);return o}function card(z){let g=z.g,a=z.a,o=opts(g,a),gs=[...new Set(o.map(x=>x[0]))];return`<article class="card"><div class="muted">${nm(g.competition.name)} · ${new Date(g.utcDate).toLocaleString('zh-CN')}</div><div class="teams">${nm(g.home.name)} VS ${nm(g.away.name)}</div><div class="grid"><div class="mini">主胜<b>${(a.p[0]*100).toFixed(1)}%</b></div><div class="mini">平局<b>${(a.p[1]*100).toFixed(1)}%</b></div><div class="mini">客胜<b>${(a.p[2]*100).toFixed(1)}%</b></div><div class="mini">推荐分/风险<b>${a.score}/${a.risk}</b></div></div><details class="box"><summary>查看模型解释</summary><div class="exp">推荐方向：${a.primary}。推荐分综合方向清晰度与样本完整度，不等于命中率。Elo差用于表示长期实力差，当前版本基于可用历史样本，样本少时参考价值下降。冷门风险衡量热门方向未打出的风险，不等于弱队直接获胜概率。GX：${a.x.toFixed(2)}-${a.y.toFixed(2)}。</div></details><div class="choice"><select id="sel-${g.id}">${gs.map(gr=>`<optgroup label="${gr}">${o.filter(x=>x[0]===gr).map(x=>`<option value="${x[1]}">${x[2]}</option>`).join('')}</optgroup>`).join('')}</select><input id="sp-${g.id}" placeholder="SP" type="number" step=".01"><input id="st-${g.id}" type="number" value="${cfg.stake}"><button onclick="add('${g.id}')">加入我的选择</button></div></article>`}async function translateAll(){let names=[...new Set(data.upcoming.flatMap(x=>[x.home.name,x.away.name,x.competition.name]).filter(x=>x&&!TR[x]))];if(!names.length)return;try{let r=await fetch('/api/translate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({texts:names})}),j=await r.json();Object.assign(TR,j.translations||{})}catch{}}async function refreshAll(){try{$('#log').textContent='正在更新';let [a,b]=await Promise.all([fetch('/api/app-data').then(r=>r.json()),fetch('/api/odds').then(r=>r.json())]);if(a.error)throw Error(a.error);data=a;odds=b.events||[];await translateAll();save();render();$('#log').textContent='更新成功：'+data.upcoming.length+'场'}catch(e){$('#log').textContent='失败：'+e.message}}function add(id){let z=view.find(x=>String(x.g.id)===String(id)),sel=$('#sel-'+id),sp=+$('#sp-'+id).value,stake=+$('#st-'+id).value;if(!(sp>1))return alert('请输入SP');choices.push({id:crypto.randomUUID(),matchId:String(id),home:z.g.home.name,away:z.g.away.name,label:sel.options[sel.selectedIndex].text,market:sel.value,sp,stake,status:'pending',checked:false});save();render()}function settle(){let n=0;choices.filter(x=>x.status==='pending').forEach(c=>{let r=data.finished.find(x=>String(x.id)===c.matchId);if(!r)return;let h=+r.score.home,a=+r.score.away,p=c.market.split('|'),hit=false;if(p[0]==='h2h')hit=+p[1]===(h>a?0:h===a?1:2);if(p[0]==='rq')hit=+p[1]===(h+cfg.handicap>a?0:h+cfg.handicap===a?1:2);if(p[0]==='score')hit=h===+p[1]&&a===+p[2];if(p[0]==='goals')hit=h+a===+p[1];if(p[0]==='ou')hit=p[1]==='over'?h+a>+p[2]:h+a<+p[2];if(p[0]==='btts')hit=(p[1]==='yes')===Boolean(h&&a);if(p[0]==='dc')hit=p[1]==='1x'?h>=a:p[1]==='12'?h!==a:h<=a;Object.assign(c,{status:'settled',hit,profit:hit?c.stake*(c.sp-1):-c.stake});n++});save();render();alert('结算'+n+'项')}function combo(){let a=choices.filter(x=>x.checked&&x.status==='pending'),s=a.reduce((x,y)=>x*y.sp,1),st=+$('#comboStake').value||0;$('#comboText').textContent=a.length?`组合SP ${s.toFixed(3)} · 返还 ${(s*st).toFixed(2)} · 盈利 ${(s*st-st).toFixed(2)}`:'请勾选'}function clearDone(){choices=choices.filter(x=>x.status!=='settled');save();render()}function render(){let q=$('#q').value.toLowerCase(),sort=$('#sort').value;view=data.upcoming.map(g=>({g,a:model(g)})).filter(z=>(z.g.home.name+z.g.away.name+nm(z.g.home.name)+nm(z.g.away.name)).toLowerCase().includes(q)).sort((x,y)=>sort==='risk'?y.a.risk-x.a.risk:y.a.score-x.a.score);$('#list').innerHTML=view.map(card).join('')||'<div class="empty">暂无赛事</div>';$('#choiceTable').innerHTML='<tr><th>组合</th><th>比赛</th><th>选择</th><th>SP</th><th>投入</th><th>状态</th><th>盈亏</th></tr>'+choices.map(c=>`<tr><td><input type="checkbox" ${c.checked?'checked':''} onchange="c=choices.find(x=>x.id==='${c.id}');c.checked=this.checked;save()"></td><td>${nm(c.home)} VS ${nm(c.away)}</td><td>${c.label}</td><td>${c.sp}</td><td>${c.stake}</td><td>${c.status}</td><td>${c.status==='settled'?c.profit.toFixed(2):'—'}</td></tr>`).join('')}function saveCfg(){cfg={lang:$('#lang').value,handicap:+$('#handicap').value,stake:+$('#stake').value};save();render()}$$('.tab').forEach(x=>x.onclick=()=>{$$('.tab,.page').forEach(y=>y.classList.remove('on'));x.classList.add('on');$('#'+x.dataset.p).classList.add('on')});['q','sort'].forEach(x=>$('#'+x).oninput=render);$('#lang').value=cfg.lang;$('#handicap').value=cfg.handicap;$('#stake').value=cfg.stake;render();
</script></body></html>
