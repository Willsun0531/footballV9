<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football AI Pro V16 Coverage Fusion</title>
<style>
:root{--bg:#07101f;--card:#101a30;--line:#273654;--txt:#f5f7ff;--muted:#93a4c5;--purple:#8b5cf6;--green:#34d399;--red:#fb7185;--blue:#60a5fa;--amber:#fbbf24}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#050914,#0b1530);color:var(--txt);font:14px system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.wrap{max-width:1280px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand h1{margin:0;font-size:28px}.badge{background:#38256b;color:#ddd0ff;padding:7px 12px;border-radius:999px}.note{color:var(--muted);margin-top:6px}.toolbar,.stats,.grid{display:grid;gap:12px}.toolbar{grid-template-columns:auto 120px 1fr;margin:18px 0}.toolbar button,.toolbar input,.toolbar select{border:1px solid var(--line);background:#0c162b;color:var(--txt);padding:12px;border-radius:12px}.toolbar button{background:linear-gradient(135deg,#7c3aed,#5b21b6);font-weight:700;cursor:pointer}.stats{grid-template-columns:repeat(6,1fr)}.stat,.panel,.match{background:rgba(16,26,48,.92);border:1px solid var(--line);border-radius:16px;padding:16px}.stat b{font-size:24px;display:block}.stat small{color:var(--muted)}.panel{margin-top:14px}.sourcebar{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:5px 9px;border-radius:999px;background:#172440;color:#c6d2ec}.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.grid{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:14px}.match-head{display:flex;justify-content:space-between;gap:12px}.league{color:#c4b5fd}.teams{font-size:19px;font-weight:750;margin:8px 0}.prob{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.prob div{background:#0a1325;border-radius:10px;padding:10px;text-align:center}.prob b{display:block;font-size:19px}.h{color:var(--red)}.d{color:var(--blue)}.a{color:var(--green)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.metric{background:#0b1529;border:1px solid #1d2b47;border-radius:10px;padding:9px}.metric span{display:block;color:var(--muted);font-size:12px}.scores{margin-top:10px;color:#dbe4f7}.empty{text-align:center;color:var(--muted);padding:50px}.log{white-space:pre-wrap;color:#9fb0cf;max-height:160px;overflow:auto}.disclaimer{border-left:3px solid var(--amber);padding-left:12px;color:#d7c991;margin-top:15px}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap"><div class="top"><div class="brand"><h1>Football AI Pro</h1><div class="note">体彩覆盖优先 · 多源数据融合 · 概率研究与复盘</div></div><span class="badge">V16 Coverage Fusion</span></div>
<div class="toolbar"><button id="refresh">刷新覆盖与预测</button><select id="days"><option value="1">1天</option><option value="2" selected>2天</option><option value="3">3天</option><option value="7">7天</option></select><input id="search" placeholder="搜索联赛或球队"></div>
<div id="stats" class="stats"></div><div class="panel"><b>数据覆盖诊断</b><div id="sources" class="sourcebar" style="margin-top:10px"></div><div id="log" class="log" style="margin-top:10px"></div></div>
<div class="disclaimer">本页面仅用于数据研究与模型复盘。模型输出不是结果保证，也不提供真实资金操作建议。数据不足时只展示基础概率，不生成正式推荐等级。</div><div id="list" class="grid"></div></div>
<script>
const $=s=>document.querySelector(s);let store={matches:[],meta:{}};
const n=v=>Number.isFinite(+v)?+v:null, pct=v=>Number.isFinite(v)?(v*100).toFixed(1)+'%':'—';
async function getJSON(url){const r=await fetch(url,{cache:'no-store'});const t=await r.text();let j;try{j=JSON.parse(t)}catch{throw new Error(url+' 返回非JSON：'+t.slice(0,80))}if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\b(fc|sc|cf|ec|afc|club|fk|ff)\b/g,'').replace(/[^a-z0-9\u4e00-\u9fff]/g,'')}
function same(a,b){const ah=norm(a.home?.name),aa=norm(a.away?.name),bh=norm(b.home?.name),ba=norm(b.away?.name);const names=(ah&&bh&&(ah.includes(bh)||bh.includes(ah)))&&(aa&&ba&&(aa.includes(ba)||ba.includes(aa)));const dt=Math.abs(new Date(a.utcDate)-new Date(b.utcDate));return names&&dt<=12*3600000}
function merge(arrays){const out=[];for(const arr of arrays)for(const m of (arr||[])){if(!out.some(x=>same(x,m)))out.push(m)}return out.sort((a,b)=>new Date(a.utcDate)-new Date(b.utcDate))}
function poisson(k,l){let f=1;for(let i=2;i<=k;i++)f*=i;return Math.exp(-l)*Math.pow(l,k)/f}
function inferModel(m){
 const mp=m.modelProbability||m.probabilities||{};let p=[n(mp.home),n(mp.draw),n(mp.away)];
 if(p.every(x=>x!==null)){const s=p.reduce((a,b)=>a+b,0);p=p.map(x=>x/s)}else{
   const lh=Math.max(.15,n(m.gxHome)||n(m.homeGX)||1.35),la=Math.max(.15,n(m.gxAway)||n(m.awayGX)||1.17);p=[0,0,0];for(let h=0;h<=8;h++)for(let a=0;a<=8;a++){const q=poisson(h,lh)*poisson(a,la);p[h>a?0:h===a?1:2]+=q}
 }
 const gxH=Math.max(.15,n(m.gxHome)||n(m.homeGX)||1.35),gxA=Math.max(.15,n(m.gxAway)||n(m.awayGX)||1.17);
 const scores=[];for(let h=0;h<=6;h++)for(let a=0;a<=6;a++)scores.push({s:`${h}:${a}`,p:poisson(h,gxH)*poisson(a,gxA)});scores.sort((x,y)=>y.p-x.p);
 const market=m.marketProbability||null;const value=market&&[0,1,2].map(i=>p[i]-(market[['home','draw','away'][i]]||0));
 return {p,gxH,gxA,scores:scores.slice(0,5),market,value,quality:n(m.dataQuality)||0,samples:n(m.samples)||0};
}
function render(){const q=norm($('#search').value);const rows=store.matches.filter(m=>!q||norm((m.competition?.name||'')+(m.home?.name||'')+(m.away?.name||'')).includes(q));const s=store.meta;$('#stats').innerHTML=[['体彩开售',s.lottery||0],['API赛程',s.fixtures||0],['国际赔率',s.odds||0],['合并展示',rows.length],['赔率匹配',s.oddsMatched||0],['覆盖率',s.coverage==null?'—':s.coverage.toFixed(1)+'%']].map(x=>`<div class="stat"><b>${x[1]}</b><small>${x[0]}</small></div>`).join('');
 $('#sources').innerHTML=[`<span class="pill">体彩：${s.lotteryStatus||'未知'}</span>`,`<span class="pill">API-Sports：${s.fixtureStatus||'未知'}</span>`,`<span class="pill">赔率：${s.oddsStatus||'未知'}</span>`].join('');
 $('#list').innerHTML=rows.length?rows.map(m=>{const z=inferModel(m),lead=[...z.p].sort((a,b)=>b-a)[0]-[...z.p].sort((a,b)=>b-a)[1],personal=z.samples>0||z.market||m.personalized;return `<article class="match"><div class="match-head"><div><span class="league">${m.competition?.name||'未知联赛'}</span><div class="teams">${m.home?.name||'?'} <span style="color:#7384a8">VS</span> ${m.away?.name||'?'}</div></div><div>${new Date(m.utcDate).toLocaleString('zh-CN',{timeZone:'Asia/Hong_Kong',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</div></div><div class="prob"><div><b class="h">${pct(z.p[0])}</b>主胜</div><div><b class="d">${pct(z.p[1])}</b>平局</div><div><b class="a">${pct(z.p[2])}</b>客胜</div></div><div class="metrics"><div class="metric"><span>主队GX</span>${z.gxH.toFixed(2)}</div><div class="metric"><span>客队GX</span>${z.gxA.toFixed(2)}</div><div class="metric"><span>首选领先</span>${(lead*100).toFixed(1)}pp</div><div class="metric"><span>数据状态</span>${personal?'个性化':'基础分布'}</div></div><div class="scores">比分Top 5：${z.scores.map(x=>x.s+' '+pct(x.p)).join(' · ')}</div><div class="scores">${z.market?'市场已验证，可计算价值差':'暂无完整市场赔率，价值差不计算'}</div></article>`}).join(''):`<div class="panel empty">当前日期范围没有匹配赛事。请查看覆盖诊断，而不是直接调整模型。</div>`}
async function refresh(){const days=$('#days').value;$('#refresh').disabled=true;$('#log').textContent='正在读取体彩、赛程与赔率数据…';const jobs=[['lottery',`/api/lottery-fixtures?days=${days}`],['fixtures',`/api/fixtures?days=${days}`],['odds','/api/odds'],['app','/api/app-data']];const res=await Promise.allSettled(jobs.map(x=>getJSON(x[1])));const got={};res.forEach((r,i)=>got[jobs[i][0]]=r.status==='fulfilled'?r.value:{error:r.reason.message});const lottery=got.lottery.fixtures||got.lottery.matches||[];const fi=got.fixtures.upcoming||got.fixtures.fixtures||[];const app=got.app.upcoming||[];const oe=got.odds.events||[];let all=merge([lottery,fi,app,oe.map(e=>({id:'odds-'+e.id,utcDate:e.commenceTime,competition:{name:e.league||e.sportTitle||''},home:{name:e.home},away:{name:e.away},source:'odds'}))]);const now=Date.now(),end=now+(+days)*86400000;all=all.filter(m=>{const t=new Date(m.utcDate).getTime();return t>=now-15*60000&&t<=end&&String(m.status||'SCHEDULED').toUpperCase()!=='FINISHED'});let matched=0;for(const m of all){const o=oe.find(x=>same(m,{home:{name:x.home},away:{name:x.away},utcDate:x.commenceTime}));if(o){m.oddsEvent=o;m.marketProbability=o.marketProbability||null;matched++}}
 store.matches=all;store.meta={lottery:lottery.length,fixtures:fi.length,odds:oe.length,oddsMatched:matched,coverage:lottery.length?all.filter(m=>lottery.some(x=>same(m,x))).length/lottery.length*100:null,lotteryStatus:got.lottery.error?'失败':'正常',fixtureStatus:got.fixtures.error?'失败':'正常',oddsStatus:got.odds.error?'失败':'正常'};$('#log').textContent=JSON.stringify({体彩:lottery.length,API赛程:fi.length,主赛事:app.length,赔率赛事:oe.length,合并显示:all.length,赔率匹配:matched,错误:Object.fromEntries(Object.entries(got).filter(x=>x[1].error).map(x=>[x[0],x[1].error]))},null,2);render();$('#refresh').disabled=false}
$('#refresh').onclick=refresh;$('#search').oninput=render;$('#days').onchange=refresh;render();refresh();
</script></body></html>
