<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}};
const K={cfg:'v111cfg',data:'v11d',odds:'v11o',hist:'v11h',choices:'v11x'};
let cfg=read(K.cfg,{stake:100,hcp:-1,marketW:.3}), data=read(K.data,{upcoming:[],finished:[]}), odds=read(K.odds,[]), hist=read(K.hist,{}), choices=read(K.choices,[]), view=[];
const CN={"EC Vitória":"维多利亚","SE Palmeiras":"帕尔梅拉斯","Coritiba FBC":"科里蒂巴","Cruzeiro EC":"克鲁塞罗","SC Corinthians Paulista":"科林蒂安","CA Paranaense":"巴拉纳竞技","Campeonato Brasileiro Série A":"巴西甲级联赛"};
const nm=x=>CN[x]||x;
const finite=(v,f=0)=>Number.isFinite(Number(v))?Number(v):f;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,finite(v,a)));
function save(){localStorage.setItem(K.cfg,JSON.stringify(cfg));localStorage.setItem(K.data,JSON.stringify(data));localStorage.setItem(K.odds,JSON.stringify(odds));localStorage.setItem(K.hist,JSON.stringify(hist));localStorage.setItem(K.choices,JSON.stringify(choices))}
function norm(s){return String(s||'').toLowerCase().replace(/fc|cf|club|sc|ca|ec|se|\s|[-.'’]/g,'')}
function fact(n){let z=1;for(let i=2;i<=n;i++)z*=i;return z}
function pois(l,k){return Math.exp(-l)*l**k/fact(k)}
function tau(h,a,x,y,r=-.08){if(h===0&&a===0)return 1-x*y*r;if(h===0&&a===1)return 1+x*r;if(h===1&&a===0)return 1+y*r;if(h===1&&a===1)return 1-r;return 1}
function matrix(x,y){let m=[],sum=0;for(let h=0;h<9;h++){m[h]=[];for(let a=0;a<9;a++){const v=Math.max(0,pois(x,h)*pois(y,a)*tau(h,a,x,y));m[h][a]=v;sum+=v}}if(!Number.isFinite(sum)||sum<=0)sum=1;for(let h=0;h<9;h++)for(let a=0;a<9;a++)m[h][a]=finite(m[h][a]/sum);return m}
function dynamicElo(){let r={};[...data.finished].sort((a,b)=>new Date(a.utcDate)-new Date(b.utcDate)).forEach(m=>{let h=finite(r[m.home.id],1500),a=finite(r[m.away.id],1500),hg=finite(m.score.home),ag=finite(m.score.away),e=1/(1+10**(-((h+65)-a)/400)),s=hg>ag?1:hg===ag?.5:0,d=20*Math.min(2,1+Math.abs(hg-ag)*.15)*(s-e);r[m.home.id]=h+d;r[m.away.id]=a-d});return r}
function form(id){let a=data.finished.filter(m=>m.home.id===id||m.away.id===id).sort((x,y)=>new Date(y.utcDate)-new Date(x.utcDate)).slice(0,12);if(!a.length)return null;let gf=0,ga=0,w=0;a.forEach((m,i)=>{let wt=Math.exp(-.14*i),home=m.home.id===id;gf+=finite(home?m.score.home:m.score.away)*wt;ga+=finite(home?m.score.away:m.score.home)*wt;w+=wt});return{gf:gf/w,ga:ga/w,n:a.length}}
function teamTokens(name){
 const stop=new Set(['fc','cf','sc','ec','ca','se','club','de','da','do','the','afc','fbc']);
 return String(name||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(x=>x&&!stop.has(x));
}
function teamSimilarity(a,b){
 const A=teamTokens(a),B=teamTokens(b);
 if(!A.length||!B.length)return 0;
 const same=A.filter(x=>B.includes(x)).length;
 const tokenScore=(2*same)/(A.length+B.length);
 const na=norm(a),nb=norm(b);
 const contains=na.includes(nb)||nb.includes(na)?0.35:0;
 return Math.min(1,tokenScore+contains);
}
function oddsMatch(g){
 let best=null,bestScore=0;
 const gt=new Date(g.utcDate).getTime();
 for(const o of odds){
   const normal=teamSimilarity(g.home.name,o.home)+teamSimilarity(g.away.name,o.away);
   const reversed=teamSimilarity(g.home.name,o.away)+teamSimilarity(g.away.name,o.home);
   const nameScore=Math.max(normal,reversed);
   const ot=new Date(o.commenceTime||0).getTime();
   const hours=Number.isFinite(ot)&&ot>0?Math.abs(gt-ot)/36e5:999;
   const timeScore=hours<=6?0.5:hours<=24?0.25:0;
   const score=nameScore+timeScore;
   if(score>bestScore){best=o;bestScore=score;}
 }
 return bestScore>=1.35?best:null;
}
function rows(o){let a=[];for(let b of o?.bookmakers||[])for(let m of b.markets||[])for(let x of m.outcomes||[])a.push({book:b.title,market:m.key,name:x.name,price:finite(x.price,NaN)});return a}
function market(g,o){let all=rows(o).filter(x=>x.market==='h2h'&&Number.isFinite(x.price)&&x.price>1),v=[[],[],[]];all.forEach(x=>v[x.name==='Draw'?1:norm(x.name)===norm(g.home.name)?0:2].push(x.price));let avg=z=>z.length?z.reduce((s,x)=>s+x,0)/z.length:null,od=v.map(avg);if(!od.every(x=>Number.isFinite(x)&&x>1))return null;let q=od.map(x=>1/x),sum=q.reduce((a,b)=>a+b,0);if(!Number.isFinite(sum)||sum<=0)return null;let prices=all.map(x=>x.price);return{p:q.map(x=>x/sum),books:new Set(all.map(x=>x.book)).size,disp:prices.length?Math.max(...prices)-Math.min(...prices):0}}
function calibration(){let a=choices.filter(x=>x.status==='settled'&&Array.isArray(x.probs)&&x.probs.every(Number.isFinite));if(!a.length)return{n:0,brier:null,ll:null,bins:{},factor:1};let br=0,ll=0,bins={};a.forEach(x=>{let i=x.actual,pr=x.probs;br+=pr.reduce((s,p,j)=>s+(p-(i===j?1:0))**2,0);ll+=-Math.log(Math.max(pr[i],1e-8));let c=Math.max(...pr),k=Math.floor(c*10)*10;(bins[k]??=[]).push(x)});return{n:a.length,brier:br/a.length,ll:ll/a.length,bins,factor:a.length>=30?clamp(1-(br/a.length-.55)*.18,.85,1.05):1}}
function predict(g,E,C){
 const hf=form(g.home.id),af=form(g.away.id),ed=finite(E[g.home.id],1500)-finite(E[g.away.id],1500);
 let x=hf&&af?Math.max(.25,(hf.gf+af.ga)/2*1.08):1.4, y=hf&&af?Math.max(.25,(af.gf+hf.ga)/2*.92):1.2;
 x*=Math.exp(ed/400*.14);y*=Math.exp(-ed/400*.14);
 const m=matrix(x,y),p=[0,0,0],sc=[],tot=Array(17).fill(0);let bt=0;
 for(let h=0;h<9;h++)for(let a=0;a<9;a++){let z=finite(m[h][a]);p[h>a?0:h===a?1:2]+=z;sc.push([z,h,a]);tot[h+a]+=z;if(h&&a)bt+=z}
 sc.sort((a,b)=>b[0]-a[0]);
 const o=oddsMatch(g),mk=market(g,o),w=mk?clamp(cfg.marketW,0,.6):0;
 // NaN FIX: only touch mk.p when market data exists.
 let blend=mk?p.map((z,i)=>finite(z)*(1-w)+finite(mk.p[i])*w):p.map(z=>finite(z));
 let blendSum=blend.reduce((s,z)=>s+(Number.isFinite(z)?z:0),0);
 if(!Number.isFinite(blendSum)||blendSum<=0){blend=p.map(z=>finite(z));blendSum=blend.reduce((s,z)=>s+z,0)||1}
 blend=blend.map(z=>Number.isFinite(z)?z/blendSum:0);
 const idx=[0,1,2].sort((a,b)=>blend[b]-blend[a]),labs=['主胜','平局','客胜'];
 const snap=o?hist[o.id]||[]:[],move=snap.length>1?finite(snap.at(-1).p?.[idx[0]])-finite(snap[0].p?.[idx[0]]):0;
 const comps={elo:clamp(Math.abs(ed)/12,0,15),market:mk?clamp(15-Math.abs(p[idx[0]]-mk.p[idx[0]])*80,0,15):5,disp:mk?clamp(10-mk.disp*10,0,10):3,data:clamp((hf?.n||0)+(af?.n||0),0,20),clarity:clamp((blend[idx[0]]-blend[idx[1]])*120,0,30),cal:C.n<10?0:C.n<30?clamp(5*C.factor,0,5):clamp(10*C.factor,0,10)};
 const score=Math.round(Object.values(comps).reduce((s,z)=>s+(Number.isFinite(z)?z:0),0));
 const risk=Math.round(clamp((1-p[idx[0]])*40+p[1]*55+Math.max(0,(mk?.p[idx[0]]??p[idx[0]])-p[idx[0]])*130+(mk?.disp||0)*9+Math.max(0,move)*90+(24-comps.data)*1.2,0,100));
 const rq=[0,0,0];for(let h=0;h<9;h++)for(let a=0;a<9;a++)rq[h+cfg.hcp>a?0:h+cfg.hcp===a?1:2]+=m[h][a];
 const edge=mk?Math.max(...blend.map((z,i)=>z-mk.p[i])):0, quality=Math.round(clamp((hf?.n||0)*3+(af?.n||0)*3+(mk?20:0)+(snap.length>=2?10:0)+(C.n>=30?10:0),0,100));
 return{x,y,p,blend,sc:sc.slice(0,5),tot,bt,primary:labs[idx[0]],score,risk,rq,edge,elo:ed,mk,o,move,quality,comps,cal:C};
}
function aiRec(a){let maxGoal=a.tot.indexOf(Math.max(...a.tot)),under=a.tot[0]+a.tot[1]+a.tot[2],dc=[a.p[0]+a.p[1],a.p[0]+a.p[2],a.p[1]+a.p[2]],dci=dc.indexOf(Math.max(...dc)),rqi=a.rq.indexOf(Math.max(...a.rq));return{result:a.primary,conservative:['主胜或平局','主胜或客胜','平局或客胜'][dci],range:a.x+a.y<2.2?'0至2球':a.x+a.y<3.4?'2至3球':'4球以上',ou:under>=.5?'小2.5':'大2.5',score:`${a.sc[0][1]}:${a.sc[0][2]}`,scores:a.sc.map(x=>`${x[1]}:${x[2]} ${(x[0]*100).toFixed(1)}%`).join('、'),btts:a.bt>=.5?'是':'否',rq:['让胜','让平','让负'][rqi],goal:maxGoal>=7?'7+球':maxGoal+'球'}}
function marketPriceSummary(g,a){
 const rr=rows(a.o);
 const h2h=rr.filter(x=>x.market==='h2h'&&Number.isFinite(x.price)&&x.price>1);
 const classify=x=>x.name==='Draw'?1:norm(x.name)===norm(g.home.name)?0:2;
 const labels=['主胜','平局','客胜'];
 const summary=[0,1,2].map(i=>{
   const list=h2h.filter(x=>classify(x)===i);
   if(!list.length)return{label:labels[i],avg:null,best:null,book:null};
   const avg=list.reduce((s,x)=>s+x.price,0)/list.length;
   const best=[...list].sort((x,y)=>y.price-x.price)[0];
   return{label:labels[i],avg,best:best.price,book:best.book};
 });
 const spreadMap={};
 rr.filter(x=>x.market==='spreads'&&Number.isFinite(x.price)&&Number.isFinite(x.point)).forEach(x=>{
   const key=`${x.name}|${x.point}`;
   if(!spreadMap[key]||x.price>spreadMap[key].price)spreadMap[key]=x;
 });
 return{h2h:summary,spreads:Object.values(spreadMap)};
}
function oddsPanel(g,a){
 const z=marketPriceSummary(g,a);
 if(!a.o)return `<div class="box muted"><b>赛前赔率</b><br>当前赛事未匹配到The Odds API赔率。胜平负和让球SP可在下方手工输入。</div>`;
 const h=z.h2h.map(x=>`<div class="mini">${x.label}<b>${x.avg?x.avg.toFixed(2):'—'}</b><small>最高 ${x.best?x.best.toFixed(2):'—'}${x.book?' · '+x.book:''}</small></div>`).join('');
 const sp=z.spreads.length?z.spreads.slice(0,8).map(x=>`<span class="pill grade">${nm(x.name)} ${x.point>0?'+':''}${x.point} @ ${x.price.toFixed(2)} · ${x.book}</span>`).join(' '):'暂无国际两项让球盘';
 return `<div class="box"><div class="mh"><b>赛前赔率中心</b><span class="muted">平均欧赔 / 最高可用赔率</span></div><div class="grid4">${h}<div class="mini">公司数<b>${a.mk?.books||0}</b><small>欧赔离散度 ${a.mk?a.mk.disp.toFixed(2):'—'}</small></div></div><div class="muted" style="margin-top:8px"><b>国际两项让球盘：</b>${sp}</div><div class="muted" style="margin-top:6px"><b>竞彩三项让球胜平负：</b>当前数据源不提供官方让胜/让平/让负SP，模型仅计算三项概率，SP请手工录入。</div></div>`;
}
function options(g,a){
 let r=aiRec(a),out=[], ps=marketPriceSummary(g,a);
 const hmap={主胜:0,平局:1,客胜:2};
 ps.h2h.forEach(x=>out.push(['真实胜平负',`h2h|${hmap[x.label]}`,`${x.label} · 平均${x.avg?x.avg.toFixed(2):'—'} · 最高${x.best?x.best.toFixed(2):'—'}`,x.best||x.avg||'']));
 out.push(['AI推荐','h2h|'+['主胜','平局','客胜'].indexOf(r.result),r.result,'']);
 out.push(['双重机会','dc|'+r.conservative,r.conservative,'']);
 out.push(['让球胜平负','rq|'+a.rq.indexOf(Math.max(...a.rq)),r.rq,'']);
 out.push(['总进球','goals|'+r.goal.replace(/\D/g,''),r.goal,'']);
 out.push(['大小球','ou|'+(r.ou[0]==='大'?'over':'under')+'|2.5',r.ou,'']);
 out.push(['双方进球','btts|'+(r.btts==='是'?'yes':'no'),r.btts,'']);
 a.sc.forEach(x=>out.push(['精确比分',`score|${x[1]}|${x[2]}`,`${x[1]}:${x[2]}`,'']));
 ps.spreads.forEach(x=>out.push(['国际两项让球盘',`spread|${x.name}|${x.point}`,`${nm(x.name)} ${x.point>0?'+':''}${x.point} @ ${x.price.toFixed(2)} · ${x.book}`,x.price]));
 return out;
}
function scoreLevel(score){
 if(score>=90)return{label:'极高一致性',cls:'risk-low',note:'多项模型信号高度一致，但仍不代表确定结果'};
 if(score>=80)return{label:'高支持',cls:'risk-low',note:'模型、数据与市场信号整体较强'};
 if(score>=70)return{label:'较强支持',cls:'risk-low',note:'多数信号提供支持，仍需关注风险项'};
 if(score>=55)return{label:'一般支持',cls:'risk-mid',note:'存在一定方向性，但优势不充分'};
 if(score>=40)return{label:'谨慎观察',cls:'risk-mid',note:'信号较弱或数据支持不足'};
 return{label:'低置信度观察',cls:'risk-high',note:'不建议把当前方向视为强推荐'};
}
function band(v,max){let r=max?100*v/max:0;return r>=75?'强':r>=45?'中等':r>0?'弱':'未验证'}
function modelExplanation(a){
 const first=Math.max(...a.blend), sorted=[...a.blend].sort((x,y)=>y-x), lead=(sorted[0]-sorted[1])*100;
 const eloText=Math.abs(a.elo)<30?'双方实力接近，Elo只提供很弱支持':a.elo>0?'长期实力偏向主队':'长期实力偏向客队';
 const marketText=a.mk?`已匹配${a.mk.books}家公司。模型首选与市场去水概率的接近程度决定该项得分。`:'暂无匹配国际赔率。5分是缺省基础分，不代表市场认同模型。';
 const consensusText=a.mk?`赔率极差${a.mk.disp.toFixed(2)}。得分越高代表公司间赔率越接近、市场共识越强。`:'暂无多公司赔率，3分是缺省基础分，当前无法判断市场共识。';
 const dataText=`得分来自主客队有效历史场次、赔率匹配、赔率快照和校准样本。当前页面数据完整度为${a.quality}%。`;
 const clarityText=`第一方向概率${(first*100).toFixed(1)}%，领先第二方向${lead.toFixed(1)}个百分点。领先越大，方向清晰度越高。`;
 const calText=a.cal.n<10?`校准样本${a.cal.n}场，未达到10场门槛，本项不计分。`:a.cal.n<30?`校准样本${a.cal.n}场，处于观察期，本项最高只计5分。`:`校准样本${a.cal.n}场，已使用Brier与Log Loss参与评分。`;
 const level=scoreLevel(a.score);
 return `<div><b>综合推荐分：${a.score}/100｜${level.label}</b><br>${level.note}。推荐分是信号质量评分，不是命中率。</div>
 <hr><b>1. Elo支持度：${a.comps.elo.toFixed(1)}/15｜${band(a.comps.elo,15)}</b><br>Elo差${a.elo.toFixed(0)}。${eloText}。绝对差值越大，对强势方向的支持越高。<br>
 <b>2. 市场一致性：${a.comps.market.toFixed(1)}/15｜${a.mk?band(a.comps.market,15):'未验证'}</b><br>${marketText}<br>
 <b>3. 市场共识度：${a.comps.disp.toFixed(1)}/10｜${a.mk?band(a.comps.disp,10):'未验证'}</b><br>${consensusText}<br>
 <b>4. 数据完整评分：${a.comps.data.toFixed(1)}/20｜${band(a.comps.data,20)}</b><br>${dataText}<br>
 <b>5. 方向清晰度：${a.comps.clarity.toFixed(1)}/30｜${band(a.comps.clarity,30)}</b><br>${clarityText}<br>
 <b>6. 历史校准：${a.comps.cal.toFixed(1)}/10｜${a.cal.n<10?'未评分':a.cal.n<30?'观察中':band(a.comps.cal,10)}</b><br>${calText}<hr>
 <b>最终解释：</b>${a.primary}是当前融合概率最高方向；${lead<8?'但领先优势很小，保守方向更合适':'领先优势相对明确'}。${a.quality<40?'数据完整度偏低，应降低信心。':''}`;
}
function card(z){let g=z.g,a=z.a,r=aiRec(a),op=options(g,a),gs=[...new Set(op.map(x=>x[0]))],rc=a.risk>=70?'risk-high':a.risk>=45?'risk-mid':'risk-low';return `<article class="card"><div class="top"><span>${nm(g.competition.name)}</span><span>${new Date(g.utcDate).toLocaleString('zh-CN')}</span></div><div class="teams">${nm(g.home.name)} VS ${nm(g.away.name)}</div><div class="box direct"><div class="mh"><b>AI综合推荐：${r.result}</b><span><span class="pill ${scoreLevel(a.score).cls}">${a.score}分｜${scoreLevel(a.score).label}</span> <span class="pill ${rc}">冷门风险${a.risk}</span></span></div><div class="ai-grid"><div class="ai">保守方向<b>${r.conservative}</b></div><div class="ai">进球区间<b>${r.range}</b></div><div class="ai">大小球<b>${r.ou}</b></div><div class="ai">比分首选<b>${r.score}</b></div><div class="ai">双方进球<b>${r.btts}</b></div><div class="ai">让球${cfg.hcp}<b>${r.rq}</b></div><div class="ai">Elo支持<b>${a.elo.toFixed(0)}</b></div><div class="ai">数据完整度<b>${a.quality}%</b></div></div><div class="muted">比分Top5：${r.scores}</div></div>${oddsPanel(g,a)}<div class="grid4"><div class="mini">融合主胜<b>${(a.blend[0]*100).toFixed(1)}%</b></div><div class="mini">融合平局<b>${(a.blend[1]*100).toFixed(1)}%</b></div><div class="mini">融合客胜<b>${(a.blend[2]*100).toFixed(1)}%</b></div><div class="mini">市场价值差<b>${(a.edge*100).toFixed(1)}%</b></div></div><details><summary>查看模型构成、分数含义与最终结论</summary>${modelExplanation(a)}</details><div class="choice"><select id="sel-${g.id}" onchange="document.getElementById('sp-${g.id}').value=this.options[this.selectedIndex].dataset.sp||''">${gs.map(gr=>`<optgroup label="${gr}">${op.filter(x=>x[0]===gr).map(x=>`<option value="${x[1]}" data-sp="${x[3]||''}">${x[2]}</option>`).join('')}</optgroup>`).join('')}</select><input id="sp-${g.id}" type="number" step=".01" placeholder="SP"><input id="st-${g.id}" type="number" value="${cfg.stake}"><button onclick="add('${g.id}')">加入我的选择</button></div></article>`}
async function refreshAll(){try{$('#log').textContent='正在更新...';let[a,b]=await Promise.all([fetch('/api/app-data').then(r=>r.json()),fetch('/api/odds').then(r=>r.json())]);if(a.error)throw Error(a.error);data=a;odds=b.events||[];data.upcoming.forEach(g=>{let o=oddsMatch(g),mk=market(g,o);if(o&&mk){(hist[o.id]??=[]).push({t:Date.now(),p:mk.p});hist[o.id]=hist[o.id].slice(-40)}});save();render();$('#log').textContent=`完成：赛事${data.upcoming.length}，历史${data.finished.length}，赔率${odds.length}。如果赔率仍为0，请打开/api/odds查看queriedSports、partialErrors与requestsRemaining。`}catch(e){$('#log').textContent='更新失败：'+e.message}}
function filtered(){let E=dynamicElo(),C=calibration(),q=$('#q').value.toLowerCase(),s=$('#sortF').value,a=data.upcoming.map(g=>({g,a:predict(g,E,C)})).filter(z=>(z.g.home.name+z.g.away.name+nm(z.g.home.name)+nm(z.g.away.name)).toLowerCase().includes(q));a.sort((x,y)=>s==='risk'?y.a.risk-x.a.risk:s==='edge'?y.a.edge-x.a.edge:s==='time'?new Date(x.g.utcDate)-new Date(y.g.utcDate):y.a.score-x.a.score);return a}
function add(id){let z=view.find(x=>String(x.g.id)===String(id)),sel=$('#sel-'+id),sp=+$('#sp-'+id).value,stake=+$('#st-'+id).value;if(!(sp>1))return alert('请输入有效SP');choices.push({id:crypto.randomUUID(),matchId:String(id),home:z.g.home.name,away:z.g.away.name,label:sel.options[sel.selectedIndex].text,market:sel.value,sp,stake,probs:z.a.blend,model:z.a.primary,risk:z.a.risk,hcp:cfg.hcp,status:'pending',checked:false});save();render()}
function settle(){let n=0;for(let c of choices.filter(x=>x.status==='pending')){let r=data.finished.find(x=>String(x.id)===c.matchId);if(!r)continue;let h=+r.score.home,a=+r.score.away,p=c.market.split('|'),actual=h>a?0:h===a?1:2,hit=false;if(p[0]==='h2h')hit=+p[1]===actual;if(p[0]==='rq')hit=+p[1]===(h+c.hcp>a?0:h+c.hcp===a?1:2);if(p[0]==='score')hit=h===+p[1]&&a===+p[2];if(p[0]==='goals')hit=+p[1]>=7?h+a>=7:h+a===+p[1];if(p[0]==='ou')hit=p[1]==='over'?h+a>+p[2]:h+a<+p[2];if(p[0]==='btts')hit=(p[1]==='yes')===Boolean(h&&a);if(p[0]==='spread'){let isHome=norm(p[1])===norm(r.home.name),adjusted=(isHome?h:a)+finite(p[2]),opponent=isHome?a:h;hit=adjusted>opponent;}Object.assign(c,{status:'settled',actual,hit,profit:hit?c.stake*(c.sp-1):-c.stake});n++}save();render();alert('结算'+n+'项')}
function perf(a){let z=a.filter(x=>x.status==='settled'),inv=z.reduce((s,x)=>s+x.stake,0),profit=z.reduce((s,x)=>s+x.profit,0);return{n:z.length,profit,roi:inv?profit/inv:0}}
function combo(){let a=choices.filter(x=>x.checked&&x.status==='pending'),st=+$('#comboStake').value||0,sp=a.reduce((s,x)=>s*x.sp,1);$('#comboText').textContent=a.length?`组合SP ${sp.toFixed(3)} · 返还 ${(sp*st).toFixed(2)} · 盈利 ${(sp*st-st).toFixed(2)}`:'请勾选'}
function render(){view=filtered();$('#stats').innerHTML=[['赛事',view.length],['高分',view.filter(x=>x.a.score>=78).length],['高风险',view.filter(x=>x.a.risk>=70).length],['赔率匹配',view.filter(x=>x.a.mk).length]].map(x=>`<div class="stat"><b>${x[1]}</b><small>${x[0]}</small></div>`).join('');$('#list').innerHTML=view.map(card).join('')||'<div class="empty">暂无赛事</div>';let p=perf(choices);$('#mineStats').innerHTML=[['待结算',choices.filter(x=>x.status==='pending').length],['已结算',p.n],['盈亏',p.profit.toFixed(2)],['ROI',(p.roi*100).toFixed(1)+'%']].map(x=>`<div class="stat"><b>${x[1]}</b><small>${x[0]}</small></div>`).join('');$('#choiceTable').innerHTML='<tr><th>组合</th><th>比赛</th><th>选择</th><th>SP</th><th>投入</th><th>状态</th><th>盈亏</th></tr>'+choices.map(c=>`<tr><td><input type="checkbox" ${c.checked?'checked':''} onchange="choices.find(x=>x.id==='${c.id}').checked=this.checked;save()"></td><td>${nm(c.home)} VS ${nm(c.away)}</td><td>${c.label}</td><td>${c.sp}</td><td>${c.stake}</td><td>${c.status}</td><td>${c.status==='settled'?c.profit.toFixed(2):'—'}</td></tr>`).join('');renderCal()}
function renderCal(){let c=calibration();$('#calStats').innerHTML=[['样本',c.n],['Brier',c.brier==null?'—':c.brier.toFixed(3)],['Log Loss',c.ll==null?'—':c.ll.toFixed(3)],['状态',c.n>=30?'已启用':'观察中']].map(x=>`<div class="stat"><b>${x[1]}</b><small>${x[0]}</small></div>`).join('');$('#calTable').innerHTML='<tr><th>区间</th><th>样本</th><th>预测均值</th><th>实际命中</th></tr>'+Object.entries(c.bins).map(([k,v])=>`<tr><td>${k}-${+k+9}%</td><td>${v.length}</td><td>${(v.reduce((s,x)=>s+Math.max(...x.probs),0)/v.length*100).toFixed(1)}%</td><td>${(v.filter(x=>x.hit).length/v.length*100).toFixed(1)}%</td></tr>`).join('')}
function saveCfg(){cfg={stake:+$('#stake').value||100,hcp:+$('#hcp').value,marketW:clamp(+$('#marketW').value,0,.6)};save();render()}
$$('.tab').forEach(x=>x.onclick=()=>{$$('.tab,.page').forEach(y=>y.classList.remove('on'));x.classList.add('on');$('#'+x.dataset.page).classList.add('on')});['q','sortF'].forEach(x=>$('#'+x).oninput=render);$('#stake').value=cfg.stake;$('#hcp').value=cfg.hcp;$('#marketW').value=cfg.marketW;render();
</script></body></html>
